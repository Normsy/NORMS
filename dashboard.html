<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMS Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Segoe UI, Arial, sans-serif;
    background: #0f0f13;
    color: #f3f4f6;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.account-header {
    background: #181820;
    border: 1px solid #2d2d3a;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

.account-tabs {
    display: flex;
    gap: 24px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #9ca3af;
    text-transform: uppercase;
    margin-bottom: 16px;
    border-bottom: 1px solid #2d2d3a;
    padding-bottom: 10px;
    overflow-x: auto;
}

.account-tabs span {
    cursor: pointer;
    white-space: nowrap;
}

.account-tabs span.active {
    color: #ffffff;
}

.account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.account-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(34,197,94,0.6);
}

.username-area {
    display: flex;
    flex-direction: column;
}

.username {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
}

.platform-time {
    font-size: 12px;
    color: #9ca3af;
}

.account-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.money-badge {
    background: #5b2126;
    color: #f87171;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
}

.stat-badge {
    background: #14532d;
    color: #4ade80;
    font-size: 14px;
    font-weight: 700;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.action-btn {
    background: #1e1e2d;
    border: 1px solid #37374d;
    color: #60a5fa;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
}

.category-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

.category-box {
    background: #181820;
    border: 1px solid #2d2d3a;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

.category-header {
    padding: 16px;
    cursor: pointer;
}

.category-header:hover {
    background: #1f1f2a;
}

.category-name {
    font-size: 15px;
    font-weight: 600;
    color: #e5e7eb;
}

.category-count {
    margin-top: 6px;
    font-size: 20px;
    font-weight: 800;
    color: #4ade80;
}

.category-content {
    display: none;
    padding: 12px;
    border-top: 1px solid #2d2d3a;
    background: #121217;
}

.category-content.open {
    display: block;
}

.item {
    display: flex;
    justify-content: space-between;
    background: #181820;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    border: 1px solid #252533;
}

.item-name {
    font-weight: 500;
    font-size: 13px;
    color: #e5e7eb;
}

.item-count {
    color: #4ade80;
    font-weight: 700;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #9ca3af;
}

@media(max-width: 1100px) {
    .category-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .category-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div id="dashboard">
        <div class="loading">Loading NORMS...</div>
    </div>
</div>

<script>
const API = "https://norms.bazarte-clarkjohn06.workers.dev";
const username = "Gyazuv";

async function loadData() {
    const res = await fetch(API + "/account?username=" + username);
    const data = await res.json();

    if (!data.success) {
        document.getElementById("dashboard").innerHTML = "Account not found";
        return;
    }

    const account = data.account;
    const inv = account.inventory || {};

    document.getElementById("dashboard").innerHTML = `
        <div class="account-header">
            <div class="account-tabs">
                <span class="active">Account</span>
                <span>Money</span>
                <span>Backpack Lvl</span>
                <span>Ba...</span>
            </div>
            <div class="account-row">
                <div class="account-left">
                    <div class="status-dot"></div>
                    <div class="username-area">
                        <div class="username">${account.roblox_username}</div>
                        <div class="platform-time">Roblox &bull; Just now</div>
                    </div>
                </div>
                <div class="account-right">
                    <div class="money-badge">41.31B</div>
                    <div class="stat-badge">2</div>
                    <div class="action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="category-container">
            ${createCard("🌱 Seeds", inv.Seeds)}
            ${createCard("⚙️ Gear", inv.Gear)}
            ${createCard("📦 Crates", inv.Crates)}
            ${createCard("🐾 Pets", inv.Pets)}
        </div>
    `;
}

function createCard(title, items) {
    if (!items) {
        return "";
    }

    let total = 0;
    let content = "";

    for (let name in items) {
        let amount = Number(items[name]) || 0;
        total += amount;

        content += `
            <div class="item">
                <div class="item-name">${name}</div>
                <div class="item-count">x${amount.toLocaleString()}</div>
            </div>
        `;
    }

    const id = title.replace(/\W/g, "");

    return `
        <div class="category-box">
            <div class="category-header" onclick="toggle('${id}')">
                <div class="category-name">${title}</div>
                <div class="category-count">${total.toLocaleString()}x</div>
            </div>
            <div class="category-content" id="${id}">
                ${content}
            </div>
        </div>
    `;
}

function toggle(id) {
    document.getElementById(id).classList.toggle("open");
}

loadData();
</script>

</body>
</html>
