<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:Segoe UI,Arial,sans-serif;
background:#f5f5f7;
color:#111827;
}


.container{
max-width:1200px;
margin:auto;
}


/* USER */

.account-box{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:16px;
margin-bottom:15px;

box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.user{

font-size:18px;
font-weight:800;

}


.status{

font-size:12px;
color:#16a34a;

}



/* SLIDER */

.slider{

display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:10px;

scrollbar-width:none;

}


.slider::-webkit-scrollbar{
display:none;
}



.card{

min-width:140px;

background:white;

border:1px solid #e5e7eb;

border-radius:15px;

padding:15px;

cursor:pointer;

box-shadow:
0 5px 15px rgba(0,0,0,.05);

flex-shrink:0;

}



.card:hover{

background:#fafafa;

}



.label{

font-size:12px;
color:#6b7280;
font-weight:700;

}



.value{

margin-top:8px;
font-size:22px;
font-weight:800;
color:#16a34a;

}


.money{

color:#ef4444;

}



/* INVENTORY DISPLAY */


.inventory{

margin-top:20px;

background:white;

border:1px solid #e5e7eb;

border-radius:16px;

padding:15px;

}



.title{

font-size:18px;
font-weight:800;
margin-bottom:15px;

}



.item{

display:flex;
justify-content:space-between;

background:#f9fafb;

padding:12px;

border-radius:10px;

margin-bottom:8px;

}



.item-name{

font-weight:600;

}


.item-count{

color:#16a34a;
font-weight:800;

}


.empty{

color:#6b7280;

}



</style>

</head>


<body>


<div class="container">


<div id="dashboard">

Loading NORMS...

</div>


</div>



<script>


const API =
"https://norms.bazarte-clarkjohn06.workers.dev";


const username =
"Gyazuv";


let inventoryData={};




async function loadData(){


const res =
await fetch(
API+"/account?username="+username
);


const data =
await res.json();



if(!data.success){

document.getElementById("dashboard").innerHTML =
"Account not found";

return;

}



const account=data.account;


const inv=account.inventory || {};

inventoryData=inv;



document.getElementById("dashboard").innerHTML=`

<div class="account-box">

<div class="user">

🟢 ${account.roblox_username}

</div>

<div class="status">

Roblox • Live

</div>

</div>




<div class="slider">


${createButton(
"💰 Sheckles",
Number(account.sheckles).toLocaleString(),
"money",
null
)}


${createButton(
"🌱 Seeds",
total(inv.Seeds)+"x",
"",
"Seeds"
)}



${createButton(
"⚙️ Gear",
total(inv.Gear)+"x",
"",
"Gear"
)}



${createButton(
"📦 Crates",
total(inv.Crates)+"x",
"",
"Crates"
)}



${createButton(
"🐾 Pets",
total(inv.Pets)+"x",
"",
"Pets"
)}


</div>



<div id="inventory" class="inventory">

<div class="empty">

Click Seeds, Gear, Crates or Pets

</div>

</div>


`;

}




function createButton(label,value,color,type){


return `


<div class="card"
onclick="${type ? `showItems('${type}')` : ''}">


<div class="label">

${label}

</div>


<div class="value ${color}">

${value}

</div>


</div>


`;

}





function total(items){


let count=0;


if(!items)
return 0;



for(let i in items){

count += Number(items[i]) || 0;

}


return count;

}




function showItems(type){


let items=inventoryData[type];


let merged={};



for(let name in items){


let clean=name.trim();


merged[clean]=(merged[clean]||0)
+
(Number(items[name])||0);


}




let html="";


for(let name in merged){


html+=`

<div class="item">

<div class="item-name">

${name}

</div>


<div class="item-count">

x${merged[name].toLocaleString()}

</div>


</div>

`;

}




document.getElementById("inventory")
.innerHTML=

`

<div class="title">

${type}

</div>

${html || "<div class='empty'>No items</div>"}

`;

}



loadData();


</script>


</body>

</html>
