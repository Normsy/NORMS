<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

:root {
    --bg:#f5f5f7;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --green:#16a34a;
}


body {

    margin:0;
    padding:25px;

    font-family:
    'Segoe UI',
    Arial,
    sans-serif;

    background:var(--bg);
    color:var(--text);

}



.container {

    max-width:1200px;
    margin:auto;

}



.username {

    font-size:32px;
    font-weight:800;

    margin-bottom:25px;

}



/* CATEGORY CARDS */


.category-container {

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:20px;

}



.category-box {

    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
    0 5px 20px rgba(0,0,0,.05);

}



.category-header {

    padding:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

}



.category-header:hover {

    background:#fafafa;

}



.category-name {

    font-size:20px;
    font-weight:700;

}



.category-count {

    font-size:22px;
    font-weight:800;
    color:var(--green);

}




.category-content {

    display:none;

    padding:15px;

    border-top:
    1px solid var(--border);

}



.category-content.open {

    display:block;

}




.item {

    display:flex;

    justify-content:space-between;

    padding:12px;

    background:#f9fafb;

    border-radius:10px;

    margin-bottom:8px;

}



.item-name {

    font-weight:600;

}



.item-count {

    color:var(--green);

    font-weight:700;

}





.loading {

    text-align:center;

    padding:50px;

}




@media(max-width:900px){

.category-container {

    grid-template-columns:
    repeat(2,1fr);

}

}



@media(max-width:500px){

.category-container {

    grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<div class="container">


<div id="dashboard">

<div class="loading">
Loading NORMS...
</div>


</div>


</div>



<script>


const API =
"https://norms.bazarte-clarkjohn06.workers.dev";


const username =
"Gyazuv";




async function loadData(){


const response =
await fetch(
API +
"/account?username=" +
username
);


const data =
await response.json();



if(!data.success){

document.getElementById("dashboard").innerHTML =
"Account not found";

return;

}



const account =
data.account;


const inv =
account.inventory || {};



document.getElementById("dashboard").innerHTML = `


<div class="username">

${account.roblox_username}

</div>



<div class="category-container">


${createCategory(
"🌱 Seeds",
inv.Seeds
)}



${createCategory(
"⚙️ Gear",
inv.Gear
)}



${createCategory(
"📦 Crates",
inv.Crates
)}



${createCategory(
"🐾 Pets",
inv.Pets
)}


</div>


`;



}




function createCategory(title,items){


if(!items){

return "";

}


let total = 0;

let html = "";



for(let name in items){


let amount =
Number(items[name]) || 0;


total += amount;



html += `


<div class="item">

<div class="item-name">
${name}
</div>


<div class="item-count">
x${amount.toLocaleString()}
</div>


</div>


`;


}



let id =
title.replace(/\W/g,"");



return `


<div class="category-box">


<div class="category-header"
onclick="toggle('${id}')">


<div class="category-name">

${title}

</div>


<div class="category-count">

${total.toLocaleString()}x

</div>


</div>




<div class="category-content"
id="${id}">


${html}


</div>


</div>


`;

}




function toggle(id){

document
.getElementById(id)
.classList.toggle("open");

}



loadData();


</script>


</body>

</html>
