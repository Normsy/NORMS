<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

html, body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Segoe UI,Arial,sans-serif;
background:var(--bg-color);
color:var(--text-color);
overflow:auto;
touch-action: manipulation;
transition: background 0.3s, color 0.3s;
}

:root {
--bg-color: #f5f5f7;
--text-color: #111827;
--card-bg: #ffffff;
--border-color: #e5e7eb;
--subtext-color: #6b7280;
--input-bg: #f3f4f6;
--item-bg: #f9fafb;
--nav-card-bg: #f3f4f6;
}

[data-theme="dark"] {
--bg-color: #000000;
--text-color: #ffffff;
--card-bg: #000000;
--border-color: #ffffff;
--subtext-color: #a1a1aa;
--input-bg: #121212;
--item-bg: #121212;
--nav-card-bg: #121212;
}

.container{
width:100%;
height:100%;
margin:0;
padding:12px;
display:flex;
flex-direction:column;
justify-content:stretch;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
flex:1;
overflow-y:auto;
overflow-x:hidden;
gap:8px;
}

.main-scroll-area{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
padding-bottom:20px;
-webkit-overflow-scrolling:touch;
}

/* LOGIN / REGISTER */

.auth-box{
max-width:400px;
margin:auto;
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:16px;
padding:24px;
box-shadow:0 4px 16px rgba(0,0,0,.06);
width:100%;
}

.auth-title{
font-size:24px;
font-weight:900;
margin-bottom:4px;
}

.auth-subtitle{
font-size:13px;
color:var(--subtext-color);
margin-bottom:16px;
}

input{
width:100%;
padding:10px 12px;
border:1px solid var(--border-color);
background:var(--input-bg);
color:var(--text-color);
border-radius:8px;
margin-bottom:10px;
font-size:16px;
}

button{
border:none;
background:#111827;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

[data-theme="dark"] button {
background: #ffffff;
color: #000000;
border: 1px solid #ffffff;
}

.auth-btn{
width:100%;
}

.switch{
margin-top:12px;
text-align:center;
font-size:13px;
color:var(--subtext-color);
cursor:pointer;
}

.error{
color:#ef4444;
font-size:13px;
margin-bottom:8px;
}

.success{
color:#16a34a;
font-size:13px;
margin-bottom:8px;
}

/* SIMPLE CAPTCHA */

.captcha-box{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
}

.captcha-display{
background:var(--input-bg);
border:1px solid var(--border-color);
padding:8px 12px;
border-radius:8px;
font-weight:800;
letter-spacing:2px;
font-size:14px;
user-select:none;
color:var(--text-color);
min-width:80px;
text-align:center;
}

.captcha-box input{
margin-bottom:0;
}

/* LOADING SCREEN */

.loading-screen{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:24px;
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:16px;
max-width:320px;
margin:auto;
box-shadow:0 4px 16px rgba(0,0,0,.06);
text-align:center;
height:100%;
width:100%;
}

.spinner{
width:36px;
height:36px;
border:4px solid var(--border-color);
border-top:4px solid #111827;
border-radius:50%;
animation:spin 0.8s linear infinite;
margin-bottom:12px;
}

[data-theme="dark"] .spinner {
border-color: #27272a;
border-top-color: #ffffff;
}

@keyframes spin{
0%{ transform: rotate(0deg); }
100%{ transform: rotate(360deg); }
}

.loading-text{
font-weight:700;
font-size:14px;
color:var(--subtext-color);
}

/* HERO */

.hero-box{
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:18px;
padding:26px 24px;
box-shadow:0 2px 8px rgba(0,0,0,.03);
display:flex;
align-items:center;
gap:18px;
flex-shrink:0;
margin-bottom:4px;
}

.hero-icon{
width:64px;
height:64px;
border-radius:16px;
object-fit:cover;
background:var(--input-bg);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:700;
color:var(--subtext-color);
text-align:center;
flex-shrink:0;
overflow:hidden;
border:1px solid var(--border-color);
}

.hero-icon img {
width: 100%;
height: 100%;
object-fit: cover;
}

.hero-title{
font-size:26px;
font-weight:900;
line-height:1.1;
}

.hero-subtitle{
font-size:15px;
color:var(--subtext-color);
margin-top:4px;
}

/* STATS */

.stats-container-wrapper {
position: relative;
display: flex;
flex-direction: column;
gap: 10px;
flex-shrink: 0;
margin-bottom: 4px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat-card{
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:16px;
padding:18px 16px;
box-shadow:0 2px 6px rgba(0,0,0,.02);

}

.stat-card.clickable {
cursor: pointer;
transition: border-color 0.2s;
}

.stat-card.clickable.active-card {
border: 2px solid #111827;
}

[data-theme="dark"] .stat-card.clickable.active-card {
border: 2px solid #ffffff;
}

.stat-label{
font-size:11px;
font-weight:800;
color:var(--subtext-color);
}

.stat-value{
font-size:26px;
font-weight:900;
color:#16a34a;
margin-top:6px;
}

[data-theme="dark"] .stat-value {
color: #ffffff;
}

.stat-value.money{
color:#d97706 !important;
}

[data-theme="dark"] .stat-value.money {
color:#f59e0b !important;
}

/* NAVIGATION CARDS */

.nav-stack{
display:flex;
flex-direction:column;
gap:8px;
flex-shrink:0;
margin-top:4px;
}

.nav-row-grid{
display:grid;
grid-template-columns: repeat(5, 1fr);
gap: 6px;
background: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 18px;
padding: 12px 8px;
box-shadow: 0 2px 6px rgba(0,0,0,.02);
}

.nav-icon-card {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
gap: 6px;
user-select: none;
}

.nav-icon-box {
width: 46px;
height: 46px;
border-radius: 14px;
background: var(--nav-card-bg);
border: 1px solid var(--border-color);
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
transition: transform 0.15s ease;
}

.nav-icon-card:active .nav-icon-box {
transform: scale(0.92);
}

.nav-card-title {
font-size: 12px;
font-weight: 700;

.action-btn-styled {
width: 100%;
background: #111827;
padding: 12px;
font-size: 14px;
font-weight: 800;
border-radius: 14px;
flex-shrink: 0;
box-shadow: 0 2px 6px rgba(0,0,0,.05);
color: white;
border: none;
text-align: center;
cursor: pointer;
}

[data-theme="dark"] .action-btn-styled {
background: #ffffff;
color: #000000;
border: 1px solid #ffffff;
}

.action-btn-danger {
width: 100%;
background: #ef4444;
padding: 12px;
font-size: 14px;
font-weight: 800;
border-radius: 14px;
flex-shrink: 0;
box-shadow: 0 2px 6px rgba(239,68,68,.2);
color: white;
border: none;
text-align: center;
cursor: pointer;
}

[data-theme="dark"] .action-btn-danger {
background: #ffffff;
color: #000000;
border: 1px solid #ffffff;
}

/* ACCOUNTS CONTAINER VIEW (GRID STYLE) */

.accounts-wrapper{
display:flex;
flex-direction:column;
flex:1;
overflow:hidden;
width:100%;

.accounts-scroll-area{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
padding-right:2px;

.accounts-grid {

@media (max-width: 480px) {

.account-grid-card {

border: 1px solid var(--border-color);
border-radius: 16px;
padding: 14px 8px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;

box-shadow: 0 2px 6px rgba(0,0,0,.02);

.account-grid-icon {

height: 48px;
border-radius: 50%;

border: 1px solid var(--border-color);

align-items: center;
justify-content: center;

.account-grid-icon img {
width: 100%;

object-fit: cover;
}

.account-grid-username {

font-weight: 800;

.account-grid-status {

}

[data-theme="dark"] .online {

.offline {

[data-theme="dark"] .offline {

/* ACCOUNT CARD & SWIPE DELETE */

.account-card-container {
position: relative;
overflow: visible;
border-radius: 16px;

.swipe-action-btn {

color: white;

padding: 8px 10px;

[data-theme="dark"] .swipe-action-btn {

}

.swipe-action-btn.delete-btn {

}

[data-theme="dark"] .swipe-action-btn.delete-btn {
background: #ffffff;
color: #000000;
border: 1px solid #ffffff;
}

.account-dashboard-slot{
margin-top:14px;
position: relative;
}

.slider-container{
width: 100%;
overflow-x: auto;
overflow-y: hidden;
white-space: nowrap;

.slider-container::-webkit-scrollbar{

.slider{

.card{

.card.active-card {

[data-theme="dark"] .card.active-card {

.card.non-clickable {

.label{
font-size:12px;

.value{

color:#16a34a;
}

[data-theme="dark"] .value {

}

.money{

}

[data-theme="dark"] .money {

/* DROPDOWN */

.global-dropdown{

background:var(--card-bg);
border:1px solid var(--border-color);

.account-dashboard-slot .global-dropdown {

}

.item-grid {

.item-grid-card {

<body>

<div class="container">
<div id="app">Loading NORMS...</div>
</div>

<script>

const API = "https://norms-api-v2.bazarte-clarkjohn06.workers.dev";

let secretKey = localStorage.getItem("norms_secret");
let currentTheme = localStorage.getItem("norms_theme") || "light";
document.documentElement.setAttribute("data-theme", currentTheme);

let accounts = [];
let userInfo = {};
let currentInventory = {};
let activeDropdown = null;
let currentActiveType = {};
let mainActiveType = null;
let currentCaptcha = "";
let autoRefreshInterval = null;
let currentPage = "main";
let dashboardVersion = 0;

let avatarThumbnailCache = {};

const assetBase = "https://raw.githubusercontent.com/Normsy/NORMS/refs/heads/main/asset/";

const logoAssets = {
  account: assetBase + "icon/RobloxLogo.webp",
  garden: assetBase + "icon/GrowAGarden2Logo.webp",
  roblox: assetBase + "icon/RobloxLogo.webp",
  tutorial: assetBase + "icon/TutorialLogo.webp"
};

const ignoredGearList = ["sign", "lantern", "megaphone", "teleporter", "wheelbarrow", "playermagnet", "strawberrysniper"];

function formatSheckles(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
  if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return num.toLocaleString();
}

function parseItemNameAndWeight(rawName) {
  if (!rawName) return { name: "", isCropWithWeight: false };
  let trimmed = rawName.trim();
  let weightMatch = trimmed.match(/^(.*?)\s*\[\d+(\.\d+)?kg\]$/i);
  if (weightMatch) {
    let cleanItemName = weightMatch[1].trim();
    return { name: cleanItemName, isCropWithWeight: true };
  }
  return { name: trimmed, isCropWithWeight: false };
}

function getItemIcon(type, name) {
  if (!name) return null;
  let parsed = parseItemNameAndWeight(name);
  let cleanName = parsed.name.replace(/['\s]+/g, '');
  
  if (type === "Seeds" || type === "TotalSeeds" || parsed.isCropWithWeight) {
    if (cleanName === "Gold") return `${assetBase}Seed/GoldSeed.png`;
    if (cleanName === "Rainbow") return `${assetBase}Seed/RainbowSeed.png`;
    return `${assetBase}Seed/${cleanName}Seed.webp`;
  } else if (type === "Crops") {
    let ext = (cleanName === "Gold" || cleanName === "Rainbow") ? "WEBP" : "webp";
    return `${assetBase}Crop/${cleanName}.${ext}`;
  } else if (type === "Pets" || type === "TotalPets") {
    let basePetName = cleanName;
    const exceptions = ["GoldenDragonfly", "GoldenBee", "Goldfish"];
    if (!exceptions.includes(cleanName)) {
      basePetName = cleanName.replace(/^(Big|Mega|Rainbow|Gold)+/i, '');
    }
    return `${assetBase}Pet/${basePetName}.webp`;
  } else if (type === "Gear") {
    return `${assetBase}Gear/${cleanName}.webp`;
  } else if (type === "Crates") {
    return `${assetBase}Crate/${cleanName}.webp`;
  }
  return null;
}

function isValidItemForCategory(type, name) {
  if (!name) return false;
  let parsed = parseItemNameAndWeight(name);
  let cleanLower = parsed.name.trim().toLowerCase();
  
  if (type === "Seeds" || type === "TotalSeeds") {
    if (cleanLower === "build" || cleanLower === "shovel" || cleanLower.includes("gnome")) return false;
  } else if (type === "Crops") {
    if (cleanLower === "build" || cleanLower === "shovel") return false;
  } else if (type === "Pets" || type === "TotalPets") {
    if (cleanLower === "build" || cleanLower === "shovel") return false;
  } else if (type === "Gear") {
    if (ignoredGearList.includes(cleanLower)) return false;
  }
  return true;
}

async function fetchRobloxAvatarThumbnail(username) {
  if (!username) return logoAssets.roblox;
  if (avatarThumbnailCache[username]) {
    return avatarThumbnailCache[username];
  }
  try {
    const userRes = await fetch(`https://users.roblox.com/v1/usernames/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
    });
    const userData = await userRes.json();
    if (!userData.data || userData.data.length === 0) {
      return logoAssets.roblox;
    }
    const userId = userData.data[0].id;

    const thumbRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
    const thumbData = await thumbRes.json();
    if (thumbData.data && thumbData.data.length > 0 && thumbData.data[0].imageUrl) {
      const imageUrl = thumbData.data[0].imageUrl;
      avatarThumbnailCache[username] = imageUrl;
      return imageUrl;
    }
  } catch (e) {}
  return logoAssets.roblox;
}

async function preloadAccountThumbnails() {
  for (let acc of accounts) {

  }
}

function showMainDropdownContent(type) {
  let box = document.getElementById("main-drop");
  if(!box) return;
  let aggregated = {};
  accounts.forEach(acc => {
    let inv = acc.inventory || {};
    let targetKey = (type === 'TotalSeeds') ? 'Seeds' : 'Pets';
    let targetItems = inv[targetKey] || {};
    for(let name in targetItems) {
      let cleanName = name.trim();
      if(!isValidItemForCategory(targetKey, cleanName)) continue;
      let parsed = parseItemNameAndWeight(cleanName);
      aggregated[parsed.name] = (aggregated[parsed.name] || 0) + (Number(targetItems[name]) || 0);
    }
  });

  let iconSymbol = (type === 'TotalSeeds') ? '🌱' : '🐾';
  let iconType = (type === 'TotalSeeds') ? 'Seeds' : 'Pets';
  let html = "";
  let keys = Object.keys(aggregated);
  if(keys.length === 0) {
    html += `<div class='empty'>No items found</div>`;
  } else {
    html += `<div class="item-grid">`;
    keys.forEach(name => {
      let iconUrl = getItemIcon(iconType, name);
      let iconHtml = iconUrl ? `<img class="item-grid-icon" src="${iconUrl}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'font-size:20px;\\'>${iconSymbol}</span>';" alt="">` : `<span style="font-size:20px;">${iconSymbol}</span>`;
      html += `
        <div class="item-grid-card">
          <div class="item-grid-name">${name}</div>
          <div class="item-grid-img-container">
            ${iconHtml}
            <div class="item-grid-badge">${aggregated[name].toLocaleString()}</div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  box.innerHTML = html;
  box.classList.add("open");
}

async function openAdminTab() {
currentPage = "admin";
showLoading("Loading admin panel...");
try {
  const res = await fetch(API + "/admin/users?secret_key=" + encodeURIComponent(secretKey));
  const data = await res.json();
  let usersList = data.users || [];

  let usersHtml = "";
  if(usersList.length === 0) {
    usersHtml = `<div class="empty">No users found</div>`;
  } else {
    usersList.forEach(u => {
      let isBanned = Boolean(u.is_banned);
      let isPremium = Boolean(u.is_premium);
      let isAdmin = Boolean(u.is_admin);
      let escapedUName = u.username.replace(/'/g, "\\'");
      usersHtml += `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--item-bg); padding:10px 12px; border:1px solid var(--border-color); border-radius:10px; margin-bottom:8px;">
          <div>
            <div style="font-weight:800; font-size:14px; color:var(--text-color);">${u.username} ${isBanned ? '<span style="color:#ef4444; font-size:11px;">[BANNED]</span>' : ''}</div>
            <div style="font-size:11px; color:var(--subtext-color);">${isAdmin ? 'Admin' : (isPremium ? 'Premium' : 'Standard User')} • Created: ${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button onclick="adminUserActionQuick('${escapedUName}', '${isBanned ? 'unban' : 'ban'}')" style="padding:6px 10px; font-size:11px; background:${isBanned ? '#16a34a' : '#ef4444'};">${isBanned ? 'Unban' : 'Ban'}</button>
          </div>
        </div>
      `;
    });
  }

  document.getElementById("app").innerHTML = `
  <button class="back" onclick="openSettingsTab()">Back to Settings</button>
  <div class="hero-box">
  <div class="hero-icon"><img src="${logoAssets.account}" alt="Logo"></div>
  <div><div class="hero-title">Admin Panel</div><div class="hero-subtitle">Manage users, premium tiers & user bans</div></div>
  </div>
  <div class="settings-wrapper"><div class="settings-scroll-area">
    <div class="settings-box">
      <div class="script-section-title">Give Premium Access</div>
      <div id="adminMessage"></div>
      <input id="targetUsernameInput" placeholder="Target Username">
      <button onclick="grantPremium()" style="width:100%; margin-top:4px;">Grant Premium</button>
    </div>
    <div class="settings-box">
      <div class="script-section-title">User Ban System</div>
      <div style="font-size:12px; color:var(--subtext-color); margin-bottom:8px;">Ban or unban platform users entirely.</div>
      <div id="adminBanMessage"></div>
      <input id="targetUserBanInput" placeholder="Username to Ban/Unban">
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button onclick="adminUserAction('ban')" class="swipe-action-btn delete-btn" style="flex:1; height:40px;">Ban User</button>
        <button onclick="adminUserAction('unban')" class="action-btn-styled" style="flex:1; margin-top:0;">Unban User</button>
      </div>
    </div>
    <div class="settings-box">
      <div class="script-section-title">All Site Users (${usersList.length})</div>
      <div style="max-height: 250px; overflow-y: auto; margin-top: 8px;">
        ${usersHtml}
      </div>
    </div>
  </div></div>
  `;
} catch(e) {
  openSettingsTab();
}
}

async function adminUserActionQuick(username, actionType) {
  if(!confirm(`Are you sure you want to ${actionType} user ${username}?`)) return;
  showLoading(`${actionType === 'ban' ? 'Banning' : 'Unbanning'} user...`);
  try {
    const res = await fetch(API + "/admin/user-ban", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret_key: secretKey, username: username, action: actionType })
    });
    const data = await res.json();
    openAdminTab();
  } catch(e) {
    openAdminTab();
  }
}

async function adminUserAction(actionType) {
  let username = document.getElementById("targetUserBanInput").value.trim();
  if(!username) {
    alert("Please enter a username.");
    return;
  }
  showLoading(`${actionType === 'ban' ? 'Banning' : 'Unbanning'} user...`);
  try {
    const res = await fetch(API + "/admin/user-ban", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret_key: secretKey, username: username, action: actionType })
    });
    const data = await res.json();
    openAdminTab();
    document.getElementById("adminBanMessage").innerHTML = `<div class="${data.success ? 'success' : 'error'}">${data.message || 'Done'}</div>`;
  } catch(e) {
    openAdminTab();
    document.getElementById("adminBanMessage").innerHTML = `<div class="error">Network error occurred</div>`;
  }
}

function createButton(label, value, color, type, user, rawUser){
return `
<div class="card ${type && currentActiveType[rawUser] === type ? 'active-card' : ''} ${type ? '' : 'non-clickable'}" onclick="${type ? `toggleItems('${type}', '${user}')` : ''}">
<div class="label">${label}</div>
<div class="value ${color}">${value}</div>
</div>
`;
}

function totalFiltered(items, type){
if(!items) return 0;
let count = 0;
for(let item in items){
if(isValidItemForCategory(type, item.trim())) count += Number(items[item]) || 0;
}
return count;
}

function toggleItems(type, user){
let account = accounts.find(acc => acc.roblox_username === user);
if(!account) return;
let box = document.getElementById("drop-" + user);
if(!box) return;

if(currentActiveType[user] === type) {
currentActiveType[user] = null;
box.classList.remove("open");
return;
}

currentActiveType[user] = type;
let items = (account.inventory || {})[type] || {};
let merged = {};
for(let name in items){
let clean = name.trim();
if(!isValidItemForCategory(type, clean)) continue;
let parsed = parseItemNameAndWeight(clean);
merged[parsed.name] = (merged[parsed.name] || 0) + (Number(items[name]) || 0);
}

let icons = { Seeds:"🌱", Crops:"🌽", Gear:"⚙️", Crates:"📦", Pets:"🐾" };
let html = `<div class="item-grid">`;
for(let name in merged){
  let iconUrl = getItemIcon(type, name);
  let iconHtml = iconUrl ? `<img class="item-grid-icon" src="${iconUrl}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'font-size:20px;\\'>${icons[type] || ''}</span>';" alt="">` : `<span style="font-size:20px;">${icons[type] || ""}</span>`;
  html += `<div class="item-grid-card"><div class="item-grid-name">${name}</div><div class="item-grid-img-container">${iconHtml}<div class="item-grid-badge">${merged[name].toLocaleString()}</div></div></div>`;
}
html += `</div>`;
box.innerHTML = html || "<div class='empty'>No items</div>";
box.classList.add("open");
}

if(secretKey){
showLoading("Loading...");
loadAccounts();
autoRefreshInterval = setInterval(checkVersion, 3000);
}else{
showLogin();
}

</script>
