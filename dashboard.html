<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

<meta charset="UTF-8">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

html, body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Segoe UI,Arial,sans-serif;
background:var(--bg-color);
color:var(--text-color);
overflow:auto;
touch-action: manipulation;
transition: background 0.3s, color 0.3s;
}

:root {
--bg-color: #f5f5f7;
--text-color: #111827;
--card-bg: #ffffff;
--border-color: #e5e7eb;
--subtext-color: #6b7280;

--item-bg: #f9fafb;
}

[data-theme="dark"] {
--bg-color: #000000;
--text-color: #ffffff;
--card-bg: #000000;
--border-color: #ffffff;
--subtext-color: #a1a1aa;
--input-bg: #121212;
--item-bg: #121212;
}

.container{
width:100%;
height:100%;
margin:0;
padding:12px;
display:flex;
flex-direction:column;
justify-content:stretch;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
flex:1;
overflow-y:auto;
overflow-x:hidden;
gap:8px;
}

.main-scroll-area{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
padding-bottom:20px;

/* LOGIN / REGISTER */

margin:auto;
background:var(--card-bg);
border:1px solid var(--border-color);
border-radius:16px;
padding:24px;

}

.auth-title{
font-size:24px;
font-weight:900;
margin-bottom:4px;
}

.auth-subtitle{
font-size:13px;
color:var(--subtext-color);
margin-bottom:16px;
}

input{
width:100%;
padding:10px 12px;
border:1px solid var(--border-color);
background:var(--input-bg);
color:var(--text-color);
border-radius:8px;
margin-bottom:10px;
font-size:16px;
}

button{
border:none;
background:#111827;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

[data-theme="dark"] button {
background: #ffffff;
color: #000000;
border: 1px solid #ffffff;
}

.auth-btn{
width:100%;
}

.switch{
margin-top:12px;
text-align:center;

}

.error{
color:#ef4444;

}

.success{

font-size:13px;

/* SIMPLE CAPTCHA */

.captcha-box{

gap:8px;

}

.captcha-display{

border-radius:8px;

/* LOADING SCREEN */

.loading-screen{

flex-direction:column;

justify-content:center;

.spinner{

}

[data-theme="dark"] .spinner {

}

@keyframes spin{
0%{ transform: rotate(0deg); }
100%{ transform: rotate(360deg); }

.loading-text{

/* HERO */

<script>

const API = "https://norms-api-v2.bazarte-clarkjohn06.workers.dev";

let secretKey = localStorage.getItem("norms_secret");
let currentTheme = localStorage.getItem("norms_theme") || "light";
document.documentElement.setAttribute("data-theme", currentTheme);

let accounts = [];
let userInfo = {};
let currentInventory = {};
let activeDropdown = null;
let currentActiveType = {};
let mainActiveType = null;
let currentCaptcha = "";
let autoRefreshInterval = null;
let currentPage = "main";
let currentlySwipedUsername = null;
let dashboardVersion = 0;

// ASSET MAPPINGS
const assetBase = "https://raw.githubusercontent.com/Normsy/NORMS/refs/heads/main/asset/";

const logoAssets = {
  account: assetBase + "icon/RobloxLogo.webp",
  garden: assetBase + "icon/GrowAGarden2Logo.webp",
  roblox: assetBase + "icon/RobloxLogo.webp",
  tutorial: assetBase + "icon/TutorialLogo.webp"
};

const ignoredGearList = ["sign", "lantern", "megaphone", "teleporter", "wheelbarrow", "playermagnet", "strawberrysniper"];

function formatSheckles(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
  if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return num.toLocaleString();
}

function getItemIcon(type, name) {
  if (!name) return null;
  let cleanName = name.replace(/['\s]+/g, '');
  
  if (type === "Seeds" || type === "TotalSeeds") {
    return `${assetBase}Seed/${cleanName}Seed.webp`;
  } else if (type === "Pets" || type === "TotalPets") {
    return `${assetBase}Pet/${cleanName}.webp`;
  } else if (type === "Gear") {
    return `${assetBase}Gear/${cleanName}.webp`;
  } else if (type === "Crates") {
    return `${assetBase}Crate/${cleanName}.webp`;
  }
  return null;
}

function isValidItemForCategory(type, name) {
  if (!name) return false;
  let cleanLower = name.trim().toLowerCase();
  
  if (type === "Seeds" || type === "TotalSeeds") {
    if (cleanLower === "build" || cleanLower === "shovel") return false;
    if (cleanLower.includes("gnome")) return false; // Gnomes are not seeds
  } else if (type === "Pets" || type === "TotalPets") {
    if (cleanLower === "build" || cleanLower === "shovel") return false;
  } else if (type === "Gear") {
    if (ignoredGearList.includes(cleanLower)) return false;
  }
  return true;
}

function generateCaptcha(){
let chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let code = "";
for(let i=0; i<4; i++){
code += chars[Math.floor(Math.random() * chars.length)];
}
currentCaptcha = code;
}

async function login(){

document.getElementById("message").innerHTML = `<div class="error">Incorrect verification code</div>`;
generateCaptcha();
document.getElementById("loginCaptchaText").innerText = currentCaptcha;
document.getElementById("loginCaptchaInput").value = "";
return;
}

showLoading("Signing in...");

try {
const res = await fetch(API + "/login",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ username, password })
});
const data = await res.json();

if(!data.success){
showLogin();
document.getElementById("message").innerHTML = `<div class="error">${data.message}</div>`;
return;
}

saveSecret(data.secret_key);
loadAccounts();
} catch(e) {
showLogin();

}

async function checkVersion() {

    try {
        const res = await fetch(API + "/sync?secret_key=" + encodeURIComponent(secretKey));

        }

}

function getStatus(time){
if(!time) return { text:"Roblox • Offline", class:"offline" };
let minutes = (Date.now() - new Date(time).getTime()) / 1000 / 60;

if(minutes <= 10){
return { text:"Roblox • Online", class:"online" };
}

return { text:"Roblox • Offline (" + Math.floor(minutes) + " min ago)", class:"offline" };
}

function initSwipeToDelete(){
document.querySelectorAll('.account-card-container').forEach(container => {
let username = container.getAttribute('data-username');
let box = container.querySelector('.account-box');
let startX = 0;
let startY = 0;
let currentX = 0;
let isSwiping = false;
let isHorizontal = false;

box.addEventListener('touchstart', (e) => {
let slot = document.getElementById("slot-" + username);
let btn = document.getElementById("btn-" + username);
let isInventoryOpen = (slot && slot.innerHTML.trim() !== "") || (btn && btn.innerText === "Close");
if(isInventoryOpen) {
isSwiping = false;
return;
}

startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
currentX = startX;
isSwiping = true;
isHorizontal = false;
box.style.transition = 'none';
}, {passive: true});

box.addEventListener('touchmove', (e) => {
if(!isSwiping) return;
let x = e.touches[0].clientX;
let y = e.touches[0].clientY;
let diffX = x - startX;
let diffY = y - startY;

if(!isHorizontal && Math.abs(diffX) > Math.abs(diffY)) {
isHorizontal = true;
}

if(isHorizontal) {
currentX = x;
let maxRight = 100;
let maxLeft = -230;

if (currentlySwipedUsername === username) {
if (diffX > 0) diffX = 0;
if (diffX < maxLeft) diffX = maxLeft;
} else {
if (diffX > maxRight) diffX = maxRight + (diffX - maxRight) * 0.2;
if (diffX < maxLeft) diffX = maxLeft + (diffX - maxLeft) * 0.2;
}

box.style.transform = `translateX(${diffX}px)`;
}
}, {passive: true});

box.addEventListener('touchend', (e) => {
if(!isSwiping) return;
isSwiping = false;
if(!isHorizontal) return;

let diff = currentX - startX;
box.style.transition = 'transform 0.2s ease-out';

if(diff < -40) {
if(currentlySwipedUsername && currentlySwipedUsername !== username) {
resetSwipedCard(currentlySwipedUsername);
}
box.style.transform = `translateX(-218px)`;
currentlySwipedUsername = username;
localStorage.setItem("norms_swiped_username", username);
} else if(diff > 40) {
if(currentlySwipedUsername && currentlySwipedUsername !== username) {
resetSwipedCard(currentlySwipedUsername);
}
box.style.transform = `translateX(90px)`;
currentlySwipedUsername = username;
localStorage.setItem("norms_swiped_username", username);
} else {
box.style.transform = 'translateX(0px)';
if(currentlySwipedUsername === username) {
currentlySwipedUsername = null;
localStorage.removeItem("norms_swiped_username");
}
}
}, {passive: true});

box.addEventListener('click', (e) => {
if (currentlySwipedUsername === username) {
if (!e.target.closest('button')) {
resetSwipedCard(username);
e.stopPropagation();
}
}
});
});
}

async function toggleAutoFeature(element, username, feature) {
    const sw = element.querySelector(".ios-switch");
    const enabled = !sw.classList.contains("active");
    sw.classList.toggle("active");

    localStorage.setItem(`setting_${username}_${feature}`, enabled);

    try{
        const res = await fetch(API + "/account/settings",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                secret_key: secretKey,
                roblox_username: username,
                feature: feature,
                enabled: enabled
            })
        });

        const data = await res.json();

        if(!data.success){
            sw.classList.toggle("active");
            localStorage.setItem(`setting_${username}_${feature}`, !enabled);
            alert(data.message);
        } else {
            let account = accounts.find(acc => acc.roblox_username === username);
            if(account) {
                if(!account.settings) account.settings = {};
                if(feature === 'seeds') account.settings.AutoSeeds = enabled;
                if(feature === 'gears') account.settings.AutoGear = enabled;
                if(feature === 'pets') account.settings.AutoPets = enabled;
                account.settingsVersion = (account.settingsVersion || 0) + 1;
            }
            dashboardVersion++;
        }

    }catch(e){
        sw.classList.toggle("active");
        localStorage.setItem(`setting_${username}_${feature}`, !enabled);
    }
}

async function deleteAccount(username){
if(!confirm(`Are you sure you want to delete ${username} and all its data?`)) {
return;
}

showLoading("Deleting account...");

try {
let endpoints = [
  API + "/delete-account", 
  API + "/deleteAccount", 
  API + "/account/delete",
  API + "/delete_account"
];
let data = null;

for(let ep of endpoints) {
  try {
    let res = await fetch(ep, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret_key: secretKey, roblox_username: username })
    });
    if(res.ok) {
      let json = await res.json();
      if(json.success) {
        data = json;
        break;
      } else if(json.message) {
        data = json;
      }
    }
  } catch(e) {}
}

if(!data) {
  try {
    let res = await fetch(API + "/delete-account?secret_key=" + encodeURIComponent(secretKey) + "&roblox_username=" + encodeURIComponent(username), {
      method: "GET"
    });
    if(res.ok) {
      let json = await res.json();
      if(json.success) data = json;
    }
  } catch(e) {}
}

if(data && data.success){
loadAccounts();
} else {
alert((data && data.message) || "Failed to delete account");
loadAccounts();
}
} catch(e) {
alert("Network error occurred");
loadAccounts();
}
}

method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ secret_key: secretKey, target_username: targetUser })
});

function openAccount(username){
if (currentlySwipedUsername === username) return;

if(currentlySwipedUsername && currentlySwipedUsername !== username) {
resetSwipedCard(currentlySwipedUsername);
}

let account = accounts.find(acc => acc.roblox_username === username);
if(!account) return;

let targetAccountInventory = account.inventory || {};
if(currentActiveType[username] === undefined) {
currentActiveType[username] = null;
}

showAccountDashboard(account, targetAccountInventory);
}

function showAccountDashboard(account, targetInventory){
if(currentlySwipedUsername && currentlySwipedUsername !== account.roblox_username) {
resetSwipedCard(currentlySwipedUsername);
}

let slot = document.getElementById("slot-" + account.roblox_username);
let btn = document.getElementById("btn-" + account.roblox_username);

if(!slot) return;

let currentActive = currentActiveType[account.roblox_username] || null;

if(slot.innerHTML.trim() !== "" && slot.querySelector('.slider-container') !== null && currentActive === null){
slot.innerHTML = "";
if(btn) btn.innerText = "Inventory";
currentActiveType[account.roblox_username] = null;
return;
}

let escapedUsername = account.roblox_username.replace(/'/g, "\\'");

slot.innerHTML = `
<div class="slider-container">
<div class="slider" id="slider-${account.roblox_username}">
${createButton("Sheckles", formatSheckles(Number(account.sheckles || 0)), "money", null, escapedUsername, account.roblox_username)}
${createButton("Seeds", totalFiltered(targetInventory.Seeds, "Seeds").toLocaleString(), "", "Seeds", escapedUsername, account.roblox_username)}
${createButton("Gear", totalFiltered(targetInventory.Gear, "Gear").toLocaleString(), "", "Gear", escapedUsername, account.roblox_username)}
${createButton("Crates", totalFiltered(targetInventory.Crates, "Crates").toLocaleString(), "", "Crates", escapedUsername, account.roblox_username)}
${createButton("Pets", totalFiltered(targetInventory.Pets, "Pets").toLocaleString(), "", "Pets", escapedUsername, account.roblox_username)}
</div>
</div>
<div class="global-dropdown" id="drop-${account.roblox_username}"></div>
`;

if(btn) btn.innerText = "Close";

if(currentActive !== null){
toggleItems(currentActive, account.roblox_username);
}
}

function createButton(label,value,color,type,user,rawUser){
let activeType = currentActiveType[rawUser];
let isActive = type && activeType === type;
let activeClass = isActive ? "active-card" : "";
let clickableClass = type ? "" : "non-clickable";

return `
<div class="card ${activeClass} ${clickableClass}" id="card-${rawUser}-${type || 'money'}" onclick="${type ? `toggleItems('${type}', '${user}')` : ''}">
<div class="label">${label}</div>
<div class="value ${color}">${value}</div>
</div>
`;
}

function totalFiltered(items, type){
if(!items) return 0;
let count = 0;
let item;
for(item in items){
let cleanName = item.trim();
if(!isValidItemForCategory(type, cleanName)) continue;
count += Number(items[item]) || 0;
}
return count;
}

function toggleItems(type,user){
if(currentlySwipedUsername && currentlySwipedUsername !== user) {
resetSwipedCard(currentlySwipedUsername);
}

let account = accounts.find(acc => acc.roblox_username === user);
if(!account) return;

let box = document.getElementById("drop-" + user);
if(!box) return;

if(currentActiveType[user] === type) {
currentActiveType[user] = null;
box.classList.remove("open");
let escapedUsername = account.roblox_username.replace(/'/g, "\\'");
let slider = document.getElementById("slider-" + user);
if(slider) {
let targetInventory = account.inventory || {};
slider.innerHTML = `
${createButton("Sheckles", formatSheckles(Number(account.sheckles || 0)), "money", null, escapedUsername, account.roblox_username)}
${createButton("Seeds", totalFiltered(targetInventory.Seeds, "Seeds").toLocaleString(), "", "Seeds", escapedUsername, account.roblox_username)}
${createButton("Gear", totalFiltered(targetInventory.Gear, "Gear").toLocaleString(), "", "Gear", escapedUsername, account.roblox_username)}
${createButton("Crates", totalFiltered(targetInventory.Crates, "Crates").toLocaleString(), "", "Crates", escapedUsername, account.roblox_username)}
${createButton("Pets", totalFiltered(targetInventory.Pets, "Pets").toLocaleString(), "", "Pets", escapedUsername, account.roblox_username)}
`;
}
return;
}

currentActiveType[user] = type;

let escapedUsername = account.roblox_username.replace(/'/g, "\\'");
let slider = document.getElementById("slider-" + user);
if(slider) {
let targetInventory = account.inventory || {};
slider.innerHTML = `
${createButton("Sheckles", formatSheckles(Number(account.sheckles || 0)), "money", null, escapedUsername, account.roblox_username)}
${createButton("Seeds", totalFiltered(targetInventory.Seeds, "Seeds").toLocaleString(), "", "Seeds", escapedUsername, account.roblox_username)}
${createButton("Gear", totalFiltered(targetInventory.Gear, "Gear").toLocaleString(), "", "Gear", escapedUsername, account.roblox_username)}
${createButton("Crates", totalFiltered(targetInventory.Crates, "Crates").toLocaleString(), "", "Crates", escapedUsername, account.roblox_username)}
${createButton("Pets", totalFiltered(targetInventory.Pets, "Pets").toLocaleString(), "", "Pets", escapedUsername, account.roblox_username)}
`;
}

activeDropdown = box;
let targetInventory = account.inventory || {};
let items = targetInventory[type] || {};
let merged = {};

let name;
for(name in items){
let clean = name.trim();
if(!isValidItemForCategory(type, clean)) continue;
merged[clean] = (merged[clean] || 0) + (Number(items[name]) || 0);
}

let icons = { Seeds:"🌱", Gear:"⚙️", Crates:"📦", Pets:"🐾" };
let html = `<div class="dropdown-header">${icons[type] || ""} ${type} Inventory</div>`;

for(name in merged){
let iconUrl = getItemIcon(type, name);
let iconHtml = iconUrl ? `<img class="item-icon" src="${iconUrl}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'font-size:16px;\\'>${icons[type] || ''}</span>';" alt="">` : `<span style="font-size:16px;">${icons[type] || ""}</span>`;

html += `
<div class="item">
<div class="item-left">
${iconHtml}
<div class="item-name">${name}</div>
</div>
<div class="item-count">x${merged[name].toLocaleString()}</div>
</div>
`;
}

box.innerHTML = html || "<div class='empty'>No items</div>";
box.classList.add("open");
}

// START

if(secretKey){
showLoading("Loading dashboard layout...");
loadAccounts();
autoRefreshInterval = setInterval(checkVersion, 3000);
}else{
showLogin();
}

</script>
