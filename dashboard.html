<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMS Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Segoe UI, Arial, sans-serif;
    background: #f5f5f7;
    color: #111827;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.username {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 25px;
}

.category-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.category-header {
    padding: 25px;
    cursor: pointer;
}

.category-header:hover {
    background: #fafafa;
}

.category-name {
    font-size: 20px;
    font-weight: 700;
}

.category-count {
    margin-top: 10px;
    font-size: 26px;
    font-weight: 800;
    color: #16a34a;
}

.category-content {
    display: none;
    padding: 15px;
    border-top: 1px solid #e5e7eb;
}

.category-content.open {
    display: block;
}

.item {
    display: flex;
    justify-content: space-between;
    background: #f9fafb;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.item-name {
    font-weight: 600;
}

.item-count {
    color: #16a34a;
    font-weight: 700;
}

.loading {
    text-align: center;
}

/* Adjusted breakpoints for better responsiveness */
@media(max-width: 1100px) {
    .category-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .category-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div id="dashboard">
        <div class="loading">Loading NORMS...</div>
    </div>
</div>

<script>
const API = "https://norms.bazarte-clarkjohn06.workers.dev";
const username = "Gyazuv";

async function loadData() {
    const res = await fetch(API + "/account?username=" + username);
    const data = await res.json();

    if (!data.success) {
        document.getElementById("dashboard").innerHTML = "Account not found";
        return;
    }

    const account = data.account;
    const inv = account.inventory || {};

    document.getElementById("dashboard").innerHTML = `
        <div class="username">${account.roblox_username}</div>
        <div class="category-container">
            ${createCard("🌱 Seeds", inv.Seeds)}
            ${createCard("⚙️ Gear", inv.Gear)}
            ${createCard("📦 Crates", inv.Crates)}
            ${createCard("🐾 Pets", inv.Pets)}
        </div>
    `;
}

function createCard(title, items) {
    if (!items) {
        return "";
    }

    let total = 0;
    let content = "";

    for (let name in items) {
        let amount = Number(items[name]) || 0;
        total += amount;

        content += `
            <div class="item">
                <div class="item-name">${name}</div>
                <div class="item-count">x${amount.toLocaleString()}</div>
            </div>
        `;
    }

    const id = title.replace(/\W/g, "");

    return `
        <div class="category-box">
            <div class="category-header" onclick="toggle('${id}')">
                <div class="category-name">${title}</div>
                <div class="category-count">${total.toLocaleString()}x</div>
            </div>
            <div class="category-content" id="${id}">
                ${content}
            </div>
        </div>
    `;
}

function toggle(id) {
    document.getElementById(id).classList.toggle("open");
}

loadData();
</script>

</body>
</html>
