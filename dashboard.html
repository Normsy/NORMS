<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.item {
    display:flex;
    justify-content:space-between;
    background:#f2f2f2;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
}

h1 {
    text-align:center;
}

button {
    padding:10px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="container">

<h1>NORMS Roblox Dashboard</h1>


<div id="profile">
Loading...
</div>


</div>



<script>


// YOUR CLOUDFLARE API

const API =
"https://norms.bazarte-clarkjohn06.workers.dev";


// Roblox username to display
// Later we can connect this to your login system

const username = "Gyazuv";



async function loadData(){


    try {


        const response = await fetch(
            API + "/account?username=" + username
        );


        const data = await response.json();



        if(!data.success){

            document.getElementById("profile").innerHTML =
            "Account not found";

            return;

        }



        const account = data.account;

        const inv = account.inventory;



        document.getElementById("profile").innerHTML = `


        <div class="card">


        <h2>${account.roblox_username}</h2>


        <p>
        🆔 User ID:
        ${account.roblox_userid}
        </p>


        <h2>
        💰 Sheckles:
        ${Number(account.sheckles).toLocaleString()}
        </h2>


        <p>
        Updated:
        ${account.updated_at}
        </p>


        </div>



        <div class="card">

        <h2>🌱 Seeds</h2>

        ${showItems(inv.Seeds)}


        <h2>⚙️ Gear</h2>

        ${showItems(inv.Gear)}


        <h2>📦 Crates</h2>

        ${showItems(inv.Crates)}


        <h2>🐾 Pets</h2>

        ${showItems(inv.Pets)}


        </div>


        `;


    }


    catch(error){

        console.log(error);

        document.getElementById("profile").innerHTML =
        "Failed loading data";

    }


}



function showItems(items){


    if(!items || Object.keys(items).length === 0){

        return "<p>No items</p>";

    }


    let html="";


    for(let item in items){


        html += `

        <div class="item">

        <span>${item}</span>

        <b>x${items[item]}</b>

        </div>

        `;

    }


    return html;


}



loadData();


</script>


</body>

</html>
