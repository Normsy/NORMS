<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:Segoe UI,Arial,sans-serif;
background:#f5f5f7;
color:#111827;
}


.container{
max-width:1200px;
margin:auto;
}


/* LOGIN */

.auth-box{

max-width:400px;
margin:60px auto;
background:white;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}


.auth-title{

font-size:25px;
font-weight:900;
margin-bottom:5px;

}


.auth-subtitle{

font-size:13px;
color:#6b7280;
margin-bottom:20px;

}


input{

width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:10px;
margin-bottom:12px;
font-size:15px;

}


button{

border:none;
background:#111827;
color:white;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;

}


.auth-btn{

width:100%;

}


.switch{

margin-top:15px;
text-align:center;
font-size:13px;
color:#6b7280;
cursor:pointer;

}


.error{

color:#ef4444;
font-size:13px;
margin-bottom:10px;

}


.success{

color:#16a34a;
font-size:13px;
margin-bottom:10px;

}



/* HERO */

.hero-box{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
display:flex;
align-items:center;
gap:15px;

}


.hero-icon{

width:55px;
height:55px;
border-radius:12px;
object-fit:cover;

}


.hero-title{

font-size:22px;
font-weight:800;

}


.hero-subtitle{

font-size:13px;
color:#6b7280;

}


/* STATS */

.stats-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:15px;

}


.stat-card{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;

}


.stat-label{

font-size:11px;
font-weight:700;
color:#6b7280;

}


.stat-value{

font-size:22px;
font-weight:800;
color:#16a34a;
margin-top:5px;

}


.stat-value.money{

color:#111827;

}


/* ACCOUNT BUTTON */

.accounts-toggle-card{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.accounts-toggle-title{

font-size:18px;
font-weight:800;

}


.logout{

margin-top:15px;
background:#ef4444;

}

/* ACCOUNT CARD */

.account-box{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
margin-top:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.account-header-row{

display:flex;
justify-content:space-between;
align-items:center;

}


.account-info-col{

display:flex;
flex-direction:column;

}


.user{

font-size:18px;
font-weight:800;

}


.status{

font-size:12px;
margin-top:5px;

}


.online{

color:#16a34a;

}


.offline{

color:#6b7280;

}


.open-btn{

background:#111827;
padding:8px 15px;

}


/* INVENTORY */

.account-dashboard-slot{

margin-top:15px;

}


.slider-container{

overflow-x:auto;
scrollbar-width:none;

}


.slider-container::-webkit-scrollbar{

display:none;

}


.slider{

display:flex;
gap:12px;
width:max-content;

}


.card{

min-width:140px;
background:white;
border:1px solid #e5e7eb;
border-radius:15px;
padding:15px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.label{

font-size:12px;
font-weight:700;
color:#6b7280;

}


.value{

margin-top:8px;
font-size:22px;
font-weight:800;
color:#16a34a;

}


.money{

color:#ef4444;

}


/* DROPDOWN */


.global-dropdown{

display:none;
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:10px;
margin-top:10px;
max-height:250px;
overflow-y:auto;

}


.global-dropdown.open{

display:block;

}


.dropdown-header{

font-size:14px;
font-weight:800;
margin-bottom:8px;

}


.item{

display:flex;
justify-content:space-between;
background:#f9fafb;
padding:9px;
border-radius:8px;
margin-bottom:6px;

}


.item-name{

font-weight:600;

}


.item-count{

font-weight:800;
color:#16a34a;

}


.empty{

color:#6b7280;
padding:10px;

}


.back{

background:#111827;
margin-bottom:10px;

}


</style>

</head>


<body>


<div class="container">


<div id="app">

Loading NORMS...

</div>


</div>


<script>


const API = "https://norms-api-v2.bazarte-clarkjohn06.workers.dev";


let secretKey = localStorage.getItem("norms_secret");
let accounts = [];
let inventoryData = {};
let currentInventory = {};
let activeDropdown = null;



function saveSecret(key){

secretKey = key;

localStorage.setItem(
"norms_secret",
key
);

}



function logout(){

localStorage.removeItem("norms_secret");

secretKey = null;

showLogin();

}



function showLogin(){

document.getElementById("app").innerHTML = `


<div class="auth-box">


<div class="auth-title">

NORMS

</div>


<div class="auth-subtitle">

Login to your dashboard

</div>


<div id="message"></div>


<input id="loginUser" placeholder="Username">


<input id="loginPass" type="password" placeholder="Password">


<button class="auth-btn" onclick="login()">

Login

</button>


<div class="switch" onclick="showRegister()">

Create account

</div>


</div>


`;

}



function showRegister(){

document.getElementById("app").innerHTML = `


<div class="auth-box">


<div class="auth-title">

NORMS

</div>


<div class="auth-subtitle">

Create your account

</div>


<div id="message"></div>


<input id="regUser" placeholder="Username">


<input id="regPass" type="password" placeholder="Password">


<button class="auth-btn" onclick="register()">

Register

</button>


<div class="switch" onclick="showLogin()">

Already have account

</div>


</div>


`;

}

async function login(){

const username =
document.getElementById("loginUser").value.trim();

const password =
document.getElementById("loginPass").value;


const res = await fetch(API + "/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
password

})

});


const data = await res.json();


if(!data.success){

document.getElementById("message").innerHTML =

`<div class="error">${data.message}</div>`;

return;

}


saveSecret(data.secret_key);


loadAccounts();


}



async function register(){

const username =
document.getElementById("regUser").value.trim();

const password =
document.getElementById("regPass").value;



const res = await fetch(API + "/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
password

})

});


const data = await res.json();



if(!data.success){

document.getElementById("message").innerHTML =

`<div class="error">${data.message}</div>`;

return;

}



saveSecret(data.secret_key);



document.getElementById("message").innerHTML =

`<div class="success">
Account created. Logging in...
</div>`;



setTimeout(()=>{

loadAccounts();

},1000);



}



async function loadAccounts(){


if(!secretKey){

showLogin();

return;

}



const res = await fetch(

API + "/accounts?secret_key=" + encodeURIComponent(secretKey)

);



const data = await res.json();



if(!data.success){

logout();

return;

}



accounts = data.accounts;


renderMain();


}



function getStatus(time){


let minutes =

(Date.now() -
new Date(time).getTime())
/1000/60;



if(minutes <= 10){

return {

icon:"🟢",

text:"Roblox • Online",

class:"online"

};

}



return {

icon:"⚫",

text:"Roblox • Offline ("+
Math.floor(minutes)+
" min ago)",

class:"offline"

};


}




function renderMain(){


let online = 0;

let totalSheckles = 0;

let totalItems = 0;

let totalPets = 0;



accounts.forEach(acc=>{


if(getStatus(acc.updated_at).class=="online"){

online++;

}



totalSheckles += Number(
acc.sheckles || 0
);



let inv = acc.inventory || {};



totalItems +=

total(inv.Seeds)

+

total(inv.Gear)

+

total(inv.Crates)

+

total(inv.Pets);



totalPets +=

total(inv.Pets);


});





document.getElementById("app").innerHTML = `


<div class="hero-box">


<img class="hero-icon"

src="https://tr.rbxcdn.com/183f064f20387532fa7e5fbccb69a21d/150/150/Image/Png">


<div>

<div class="hero-title">

Grow A Garden 2

</div>


<div class="hero-subtitle">

NORMS Account Dashboard

</div>


</div>


</div>





<div class="stats-grid">


<div class="stat-card">

<div class="stat-label">

ONLINE / TOTAL

</div>


<div class="stat-value">

${online}/${accounts.length}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL SHECKLES

</div>


<div class="stat-value money">

${totalSheckles.toLocaleString()}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL ITEMS

</div>


<div class="stat-value">

${totalItems.toLocaleString()}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL PETS

</div>


<div class="stat-value">

${totalPets.toLocaleString()}

</div>


</div>


</div>




<div class="accounts-toggle-card"

onclick="openAccountsTab()">


<div class="accounts-toggle-title">

Accounts Dashboard

</div>


<div>

Open →

</div>


</div>




<button class="logout"

onclick="logout()">

Logout

</button>



`;



}



function openAccountsTab(){


let html = `


<button class="back"

onclick="renderMain()">

← Back

</button>


<div class="hero-box">


<div>


<div class="hero-title">

Accounts

</div>


<div class="hero-subtitle">

Your Roblox accounts

</div>


</div>


</div>


`;



accounts.forEach(acc=>{


let status =
getStatus(acc.updated_at);



html += `


<div class="account-box">


<div class="account-header-row">


<div class="account-info-col">


<div class="user">

${status.icon}

${acc.roblox_username}

</div>



<div class="status ${status.class}">

${status.text}

</div>



</div>



<button class="open-btn" onclick="openAccount(${JSON.stringify(acc.roblox_username)})">

Inventory

</button>


</div>



<div id="slot-${acc.roblox_username}"

class="account-dashboard-slot">

</div>


</div>


`;


});



document.getElementById("app").innerHTML = html;


}

async function openAccount(username){


const res = await fetch(

API +
"/account?secret_key=" +
encodeURIComponent(secretKey) +
"&username=" +
encodeURIComponent(username)

);



const data = await res.json();



if(!data.success){

return;

}



let account = data.account;



currentInventory =
account.inventory || {};



showAccountDashboard(account);


}




function showAccountDashboard(account){


let slot = document.getElementById(

"slot-" + account.roblox_username

);



if(!slot) return;



if(slot.innerHTML !== ""){


slot.innerHTML = "";

return;


}



slot.innerHTML = `


<div class="slider-container">


<div class="slider">



${createButton(

"💰 Sheckles",

Number(account.sheckles || 0)
.toLocaleString(),

"money",

null,

account.roblox_username

)}



${createButton(

"🌱 Seeds",

total(currentInventory.Seeds)
.toLocaleString(),

"",

"Seeds",

account.roblox_username

)}



${createButton(

"⚙️ Gear",

total(currentInventory.Gear)
.toLocaleString(),

"",

"Gear",

account.roblox_username

)}



${createButton(

"📦 Crates",

total(currentInventory.Crates)
.toLocaleString(),

"",

"Crates",

account.roblox_username

)}



${createButton(

"🐾 Pets",

total(currentInventory.Pets)
.toLocaleString(),

"",

"Pets",

account.roblox_username

)}



</div>


</div>



<div class="global-dropdown"

id="drop-${account.roblox_username}">

</div>


`;



}




function createButton(label,value,color,type,user){


return `


<div class="card"

onclick="${
type ?

`toggleItems('${type}', ${JSON.stringify(user)})`

:

""

}">


<div class="label">

${label}

</div>


<div class="value ${color}">

${value}

</div>


</div>


`;


}





function total(items){


let count = 0;


if(!items){

return 0;

}



for(let item in items){

count += Number(items[item]) || 0;

}



return count;


}





function toggleItems(type,user){


let box = document.getElementById(

"drop-" + user

);



if(activeDropdown === box &&

box.classList.contains("open")){


box.classList.remove("open");

activeDropdown = null;

return;


}



activeDropdown = box;



let items =

currentInventory[type] || {};



let merged = {};



for(let name in items){


let clean = name.trim();



merged[clean] =

(merged[clean] || 0)

+

(Number(items[name]) || 0);


}





let icons = {

Seeds:"🌱",

Gear:"⚙️",

Crates:"📦",

Pets:"🐾"

};



let html = `


<div class="dropdown-header">

${icons[type] || ""}

${type} Inventory

</div>


`;



for(let name in merged){


html += `


<div class="item">


<div class="item-name">

${name}

</div>


<div class="item-count">

x${merged[name].toLocaleString()}

</div>


</div>


`;


}



box.innerHTML =

html ||

"<div class='empty'>No items</div>";



box.classList.add("open");


}




// START

if(secretKey){

loadAccounts();

}else{

showLogin();

}


</script>


</body>

</html>
