<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:Segoe UI,Arial,sans-serif;
background:#f5f5f7;
color:#111827;
}

.container{
max-width:1200px;
margin:auto;
}

/* HEADER HERO BOX */
.hero-box{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
display:flex;
align-items:center;
gap:15px;
}

.hero-icon{
width:55px;
height:55px;
border-radius:12px;
background:#e5e7eb;
object-fit:cover;
}

.hero-title{
font-size:22px;
font-weight:800;
color:#111827;
}

.hero-subtitle{
font-size:13px;
color:#6b7280;
margin-top:3px;
}

/* STATS GRID */
.stats-grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:12px;
margin-bottom:15px;
}

.stat-card{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.stat-label{
font-size:11px;
font-weight:700;
color:#6b7280;
margin-top:8px;
text-transform:uppercase;
letter-spacing:0.5px;
}

.stat-value{
font-size:20px;
font-weight:800;
color:#16a34a;
margin-top:4px;
}

.stat-value.money{
color:#111827;
}

/* ACCOUNTS SECTION TOGGLE CARD */
.accounts-toggle-card{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.accounts-toggle-card:hover{
background:#fafafa;
}

.accounts-toggle-title{
font-size:18px;
font-weight:800;
color:#111827;
}

.accounts-toggle-icon{
font-size:14px;
color:#6b7280;
font-weight:600;
}

/* ACCOUNTS LIST COLLAPSIBLE CONTAINER */
.accounts-list-content{
display:none;
}

.accounts-list-content.open{
display:block;
}

/* ACCOUNT */
.account-box{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
cursor:pointer;
}

.account-box:hover{
background:#fafafa;
}

.user{
font-size:18px;
font-weight:800;
display:flex;
justify-content:space-between;
align-items:center;
}

.toggle-icon{
font-size:14px;
color:#6b7280;
font-weight:600;
}

.status{
font-size:12px;
margin-top:3px;
}

.online{
color:#16a34a;
}

.offline{
color:#6b7280;
}

/* DASHBOARD */
.dashboard-content{
display:none;
}

.dashboard-content.open{
display:block;
}

/* SLIDER */
.slider-container{
width:100%;
overflow-x:auto;
overflow-y:hidden;
padding-bottom:5px;
scrollbar-width:none;
}

.slider-container::-webkit-scrollbar{
display:none;
}

.slider{
display:flex;
gap:12px;
width:max-content;
}

.card-wrapper{
flex-shrink:0;
}

.card{
min-width:140px;
background:white;
border:1px solid #e5e7eb;
border-radius:15px;
padding:15px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.card:hover{
background:#fafafa;
}

.label{
font-size:12px;
font-weight:700;
color:#6b7280;
}

.value{
margin-top:8px;
font-size:22px;
font-weight:800;
color:#16a34a;
}

.money{
color:#ef4444;
}

/* DROPDOWN */
.global-dropdown{
width:100%;
max-height:250px;
overflow-y:auto;
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:10px;
display:none;
box-shadow:0 10px 25px rgba(0,0,0,.12);
margin-top:8px;
}

.global-dropdown.open{
display:block;
}

.item{
display:flex;
justify-content:space-between;
background:#f9fafb;
padding:9px;
border-radius:8px;
margin-bottom:6px;
font-size:13px;
}

.item-name{
font-weight:600;
}

.item-count{
color:#16a34a;
font-weight:800;
}

.empty{
font-size:13px;
color:#6b7280;
padding:10px;
}

.back{
margin-bottom:10px;
border:none;
background:#111827;
color:white;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">
<div id="dashboard">
Loading NORMS...
</div>
</div>

<script>

const API = "https://norms.bazarte-clarkjohn06.workers.dev";

let inventoryData={};
let activeType=null;
let isDashboardOpen=false;
let isAccountsListOpen=false;
let globalAccountsData = [];

async function loadAccounts(){
const res = await fetch(API+"/accounts");
const data = await res.json();

if(!data.success){
document.getElementById("dashboard").innerHTML="No accounts found";
return;
}

globalAccountsData = data.accounts;
renderHeroAndAccounts();
}

function getStatus(time){
let last = new Date(time).getTime();
let now = Date.now();
let minutes = (now-last)/1000/60;

if(minutes <= 10){
return {
icon:"🟢",
text:"Roblox • Online",
class:"online"
};
}

return {
icon:"⚫",
text: "Roblox • Offline • "+ Math.floor(minutes)+" min ago",
class:"offline"
};
}

function renderHeroAndAccounts(){
let totalOnline = 0;
let totalMoney = 0;
let totalItemsCount = 0;
let totalPetsCount = 0;

globalAccountsData.forEach(acc => {
let st = getStatus(acc.updated_at);
if(st.class === "online") totalOnline++;
totalMoney += Number(acc.sheckles || 0);

if(acc.inventory){
if(acc.inventory.Seeds){
for(let k in acc.inventory.Seeds) totalItemsCount += Number(acc.inventory.Seeds[k])||0;
}
if(acc.inventory.Gear){
for(let k in acc.inventory.Gear) totalItemsCount += Number(acc.inventory.Gear[k])||0;
}
if(acc.inventory.Crates){
for(let k in acc.inventory.Crates) totalItemsCount += Number(acc.inventory.Crates[k])||0;
}
if(acc.inventory.Pets){
for(let k in acc.inventory.Pets) totalPetsCount += Number(acc.inventory.Pets[k])||0;
}
}
});

let html = `
<div class="hero-box">
<img class="hero-icon" src="https://tr.rbxcdn.com/183f064f20387532fa7e5fbccb69a21d/150/150/Image/Png" alt="Icon">
<div>
<div class="hero-title">Grow A Garden 2</div>
<div class="hero-subtitle">Overview of your tracked accounts</div>
</div>
</div>

<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">Online / Total</div>
<div class="stat-value">${totalOnline}/${globalAccountsData.length}</div>
</div>
<div class="stat-card">
<div class="stat-label">Total Money</div>
<div class="stat-value money">${totalMoney.toLocaleString()}</div>
</div>
<div class="stat-card">
<div class="stat-label">Total Items</div>
<div class="stat-value">${totalItemsCount.toLocaleString()}</div>
</div>
<div class="stat-card">
<div class="stat-label">Total Pets</div>
<div class="stat-value">${totalPetsCount.toLocaleString()}</div>
</div>
</div>

<div class="accounts-toggle-card" onclick="toggleAccountsList()">
<div class="accounts-toggle-title">Accounts</div>
<div class="accounts-toggle-icon" id="accountsToggleIcon">${isAccountsListOpen ? '▲ Hide' : '▼ Show'}</div>
</div>

<div class="accounts-list-content ${isAccountsListOpen ? 'open' : ''}" id="accountsListContent">
`;

globalAccountsData.forEach(account=>{
let status=getStatus(account.updated_at);
html+=`
<div class="account-box" onclick="openAccount('${account.roblox_username}')">
<div class="user">
<span>${status.icon} ${account.roblox_username}</span>
<span class="toggle-icon">Open</span>
</div>
<div class="status ${status.class}">${status.text}</div>
</div>
`;
});

html += `</div>`;

document.getElementById("dashboard").innerHTML=html;
}

function toggleAccountsList(){
isAccountsListOpen = !isAccountsListOpen;
let content = document.getElementById("accountsListContent");
let icon = document.getElementById("accountsToggleIcon");

if(isAccountsListOpen){
content.classList.add("open");
icon.innerText = "▲ Hide";
} else {
content.classList.remove("open");
icon.innerText = "▼ Show";
}
}

async function openAccount(username){
const res = await fetch(API+"/account?username="+username);
const data = await res.json();

if(!data.success) return;

let account=data.account;
inventoryData=account.inventory || {};
renderDashboard(account);
}

function renderDashboard(account){
let status=getStatus(account.updated_at);

document.getElementById("dashboard").innerHTML=`
<button class="back" onclick="loadAccounts()">← Accounts</button>

<div class="account-box" onclick="toggleDashboard()">
<div class="user">
<span>${status.icon} ${account.roblox_username}</span>
<span class="toggle-icon" id="toggleIcon">${isDashboardOpen ? "▲ Hide":"▼ Show"}</span>
</div>
<div class="status ${status.class}">${status.text}</div>
</div>

<div class="dashboard-content ${isDashboardOpen ? "open":""}" id="dashboardContent">
<div class="slider-container">
<div class="slider">
${createButton("💰 Sheckles", Number(account.sheckles).toLocaleString(), "money", null)}
${createButton("🌱 Seeds", total(inventoryData.Seeds)+"x", "", "Seeds")}
${createButton("⚙️ Gear", total(inventoryData.Gear)+"x", "", "Gear")}
${createButton("📦 Crates", total(inventoryData.Crates)+"x", "", "Crates")}
${createButton("🐾 Pets", total(inventoryData.Pets)+"x", "", "Pets")}
</div>
</div>

<div class="global-dropdown" id="globalDropdown"></div>
</div>
`;
}

function toggleDashboard(){
isDashboardOpen=!isDashboardOpen;
let box=document.getElementById("dashboardContent");
let icon=document.getElementById("toggleIcon");

if(isDashboardOpen){
box.classList.add("open");
icon.innerText="▲ Hide";
}else{
box.classList.remove("open");
icon.innerText="▼ Show";
closeDropdown();
}
}

function createButton(label,value,color,type){
return `
<div class="card-wrapper">
<div class="card" onclick="event.stopPropagation(); ${type ? `toggleItems('${type}')`:'closeDropdown()'}">
<div class="label">${label}</div>
<div class="value ${color}">${value}</div>
</div>
</div>
`;
}

function total(items){
let count=0;
if(!items) return 0;
for(let i in items){
count+=Number(items[i])||0;
}
return count;
}

function toggleItems(type){
let box=document.getElementById("globalDropdown");

if(activeType===type && box.classList.contains("open")){
box.classList.remove("open");
activeType=null;
return;
}

activeType=type;
let items=inventoryData[type] || {};
let merged={};

for(let name in items){
let clean=name.trim();
merged[clean]=(merged[clean]||0)+Number(items[name]||0);
}

let html="";
for(let name in merged){
html+=`
<div class="item">
<div class="item-name">${name}</div>
<div class="item-count">x${merged[name].toLocaleString()}</div>
</div>
`;
}

box.innerHTML=html || "<div class='empty'>No items</div>";
box.classList.add("open");
}

function closeDropdown(){
let box=document.getElementById("globalDropdown");
if(box){
box.classList.remove("open");
}
activeType=null;
}

loadAccounts();

</script>

</body>

</html>
