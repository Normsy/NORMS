<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:Segoe UI,Arial,sans-serif;
background:#f5f5f7;
color:#111827;
}


.container{
max-width:1200px;
margin:auto;
}


/* HERO */

.hero-box{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.hero-title{

font-size:22px;
font-weight:800;

}


.hero-subtitle{

font-size:13px;
color:#6b7280;

}



/* STATS */

.stats-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:15px;

}


.stat-card{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;

}


.stat-label{

font-size:11px;
font-weight:700;
color:#6b7280;

}


.stat-value{

font-size:22px;
font-weight:800;
color:#16a34a;
margin-top:5px;

}



/* BUTTON */

.accounts-toggle-card{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.accounts-toggle-title{

font-size:18px;
font-weight:800;

}



/* ACCOUNT CARD */

.account-box{

background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
margin-top:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.user{

display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
font-weight:800;

}


.status{

font-size:12px;
margin-top:5px;

}


.online{

color:#16a34a;

}


.offline{

color:#6b7280;

}



.open-btn{

border:none;
background:#111827;
color:white;
padding:8px 15px;
border-radius:10px;
cursor:pointer;

}



/* ACCOUNT INVENTORY AREA */


.account-dashboard-slot{

margin-top:15px;

}




/* SLIDER */

.slider-container{

overflow-x:auto;
overflow-y:hidden;
scrollbar-width:none;

}


.slider-container::-webkit-scrollbar{

display:none;

}


.slider{

display:flex;
gap:12px;
width:max-content;

}


.card{

min-width:140px;
background:white;
border:1px solid #e5e7eb;
border-radius:15px;
padding:15px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.05);

}


.label{

font-size:12px;
font-weight:700;
color:#6b7280;

}


.value{

margin-top:8px;
font-size:22px;
font-weight:800;
color:#16a34a;

}


.money{

color:#ef4444;

}



/* DROPDOWN */


.global-dropdown{

display:none;
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:10px;
margin-top:10px;
max-height:250px;
overflow-y:auto;

}


.global-dropdown.open{

display:block;

}



.item{

display:flex;
justify-content:space-between;
background:#f9fafb;
padding:9px;
border-radius:8px;
margin-bottom:6px;

}


.item-name{

font-weight:600;

}


.item-count{

color:#16a34a;
font-weight:800;

}


.empty{

color:#6b7280;
padding:10px;

}



.back{

border:none;
background:#111827;
color:white;
padding:10px 15px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;

}


</style>

</head>


<body>


<div class="container">

<div id="dashboard">

Loading NORMS...

</div>

</div>

<script>

const API = "https://norms.bazarte-clarkjohn06.workers.dev";


let accounts = [];
let inventoryData = {};
let activeType = null;
let activeDropdown = null;



async function loadAccounts(){

    const res = await fetch(API + "/accounts");
    const data = await res.json();


    if(!data.success){

        document.getElementById("dashboard").innerHTML =
        "No accounts found";

        return;

    }


    accounts = data.accounts;

    renderMain();

}




function getStatus(time){

    let minutes =
    (Date.now() - new Date(time).getTime()) / 1000 / 60;


    if(minutes <= 10){

        return {
            icon:"🟢",
            text:"Roblox • Online",
            class:"online"
        };

    }


    return {

        icon:"⚫",
        text:"Roblox • Offline ("+
        Math.floor(minutes)+" min ago)",
        class:"offline"

    };

}




function renderMain(){


let online = 0;


accounts.forEach(acc=>{

    if(getStatus(acc.updated_at).class=="online"){
        online++;
    }

});



document.getElementById("dashboard").innerHTML = `


<div class="hero-box">

<div class="hero-title">
🌱 Grow A Garden 2
</div>

<div class="hero-subtitle">
NORMS Roblox Account Monitoring
</div>


</div>



<div class="stats-grid">


<div class="stat-card">

<div class="stat-label">
Accounts
</div>

<div class="stat-value">
${accounts.length}
</div>

</div>



<div class="stat-card">

<div class="stat-label">
Online
</div>

<div class="stat-value">
${online}
</div>

</div>



</div>




<div class="accounts-toggle-card"
onclick="openAccountsTab()">


<div class="accounts-toggle-title">

Accounts Dashboard

</div>


<div>
Open →
</div>


</div>


`;

}




function openAccountsTab(){



let html = `


<button class="back"
onclick="renderMain()">

← Back

</button>


<div class="hero-box">

<div class="hero-title">
Accounts
</div>

<div class="hero-subtitle">
Your tracked Roblox accounts
</div>

</div>


`;



accounts.forEach(acc=>{


let status = getStatus(acc.updated_at);



html += `


<div class="account-box">


<div class="user">


<span>

${status.icon}
${acc.roblox_username}

</span>


<button class="open-btn"

onclick="openAccount('${acc.roblox_username}')">

Open

</button>


</div>


<div class="status ${status.class}">

${status.text}

</div>



<div id="slot-${acc.roblox_username}"

class="account-dashboard-slot">

</div>


</div>


`;

});



document.getElementById("dashboard").innerHTML = html;


}





async function openAccount(username){


const res = await fetch(
API+"/account?username="+username
);


const data = await res.json();



if(!data.success)
return;



let account = data.account;



inventoryData = account.inventory || {};



showAccountDashboard(account);


}




function showAccountDashboard(account){



let slot =
document.getElementById(
"slot-"+account.roblox_username
);



if(slot.innerHTML!=""){

    slot.innerHTML="";
    return;

}



slot.innerHTML = `


<div class="slider-container">


<div class="slider">


${createButton(
"💰 Sheckles",
Number(account.sheckles).toLocaleString(),
"money",
null,
account.roblox_username
)}



${createButton(
"🌱 Seeds",
total(inventoryData.Seeds)+"x",
"",
"Seeds",
account.roblox_username
)}



${createButton(
"⚙️ Gear",
total(inventoryData.Gear)+"x",
"",
"Gear",
account.roblox_username
)}



${createButton(
"📦 Crates",
total(inventoryData.Crates)+"x",
"",
"Crates",
account.roblox_username
)}



${createButton(
"🐾 Pets",
total(inventoryData.Pets)+"x",
"",
"Pets",
account.roblox_username
)}



</div>


</div>



<div class="global-dropdown"

id="drop-${account.roblox_username}">

</div>


`;



}





function createButton(label,value,color,type,user){


return `


<div class="card"

onclick="${type ?
`toggleItems('${type}','${user}')`
:
''}">


<div class="label">

${label}

</div>


<div class="value ${color}">

${value}

</div>


</div>


`;

}




function total(items){


let count=0;


if(!items)
return 0;



for(let i in items){

count += Number(items[i]) || 0;

}


return count;


}





function toggleItems(type,user){



let box =
document.getElementById(
"drop-"+user
);



if(activeDropdown==box && box.classList.contains("open")){

box.classList.remove("open");
activeDropdown=null;

return;

}



activeDropdown=box;



let items =
inventoryData[type] || {};



let merged={};



for(let name in items){


let clean=name.trim();


merged[clean] =
(merged[clean]||0)
+
Number(items[name]);


}




let html="";



for(let name in merged){


html += `


<div class="item">


<div class="item-name">

${name}

</div>


<div class="item-count">

x${merged[name].toLocaleString()}

</div>


</div>


`;

}



box.innerHTML =
html ||
"<div class='empty'>No items</div>";



box.classList.add("open");

}



loadAccounts();


</script>


</body>

</html>
