<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:15px;

    font-family:Segoe UI, Arial, sans-serif;

    background:#f7f7f9;
    color:#111827;

}


.container{

    max-width:1400px;
    margin:auto;

}


/* FIXED USER */

.account-fixed{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:16px;

    margin-bottom:15px;

    box-shadow:0 4px 15px rgba(0,0,0,.06);

}



.account-info-card{

    display:flex;

    align-items:center;

    gap:10px;

}



.status-dot{

    width:10px;
    height:10px;

    background:#22c55e;

    border-radius:50%;

}



.username{

    font-size:16px;

    font-weight:800;

}


.platform-time{

    font-size:12px;

    color:#6b7280;

}




/* SLIDING STATS */


.scrollable-row{

    display:flex;

    gap:12px;

    overflow-x:auto;

    padding-bottom:8px;

    scrollbar-width:none;

}


.scrollable-row::-webkit-scrollbar{

    display:none;

}



.info-card{

    min-width:140px;

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:15px;

    flex-shrink:0;

    box-shadow:0 4px 15px rgba(0,0,0,.05);

}



.info-card-label{

    font-size:12px;

    color:#6b7280;

    font-weight:700;

}



.info-card-value{

    margin-top:8px;

    font-size:20px;

    font-weight:800;

}


.money-value{

    color:#ef4444;

}


.stat-value{

    color:#16a34a;

}





/* INVENTORY */

.category-container{

    margin-top:20px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

}



.category-box{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    overflow:hidden;

}



.category-header{

    padding:18px;

    cursor:pointer;

}



.category-header:hover{

    background:#f9fafb;

}



.category-name{

    font-size:16px;

    font-weight:700;

}



.category-count{

    margin-top:6px;

    font-size:22px;

    color:#16a34a;

    font-weight:800;

}



.category-content{

    display:none;

    padding:12px;

    border-top:1px solid #e5e7eb;

}



.category-content.open{

    display:block;

}



.item{

    display:flex;

    justify-content:space-between;

    background:#f9fafb;

    padding:10px;

    border-radius:10px;

    margin-bottom:6px;

}



.item-name{

    font-size:13px;

    font-weight:600;

}



.item-count{

    color:#16a34a;

    font-weight:700;

}



@media(max-width:900px){

.category-container{

    grid-template-columns:repeat(2,1fr);

}

}



@media(max-width:500px){

.category-container{

    grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<div class="container">


<div id="dashboard">

Loading NORMS...

</div>


</div>



<script>


const API =
"https://norms.bazarte-clarkjohn06.workers.dev";


const username =
"Gyazuv";



async function loadData(){


const res =
await fetch(API+"/account?username="+username);


const data =
await res.json();



if(!data.success){

document.getElementById("dashboard").innerHTML =
"Account not found";

return;

}



const account =
data.account;


const inv =
account.inventory || {};



const seedTotal =
sumCategory(inv.Seeds);

const gearTotal =
sumCategory(inv.Gear);

const crateTotal =
sumCategory(inv.Crates);

const petTotal =
sumCategory(inv.Pets);



document.getElementById("dashboard").innerHTML = `



<!-- FIXED USER -->

<div class="account-fixed">


<div class="account-info-card">


<div class="status-dot"></div>


<div>

<div class="username">

${account.roblox_username}

</div>


<div class="platform-time">

Roblox • Live

</div>


</div>


</div>


</div>





<!-- SLIDING DATA -->


<div class="scrollable-row">


${statCard(
"Sheckles",
Number(account.sheckles).toLocaleString(),
"money-value"
)}


${statCard(
"🌱 Seeds",
seedTotal.toLocaleString()+"x",
"stat-value"
)}


${statCard(
"⚙️ Gear",
gearTotal.toLocaleString()+"x",
"stat-value"
)}


${statCard(
"📦 Crates",
crateTotal.toLocaleString()+"x",
"stat-value"
)}


${statCard(
"🐾 Pets",
petTotal.toLocaleString()+"x",
"stat-value"
)}


</div>




<div class="category-container">


${createCard("🌱 Seeds",inv.Seeds)}

${createCard("⚙️ Gear",inv.Gear)}

${createCard("📦 Crates",inv.Crates)}

${createCard("🐾 Pets",inv.Pets)}


</div>


`;



}





function statCard(label,value,color){


return `

<div class="info-card">

<div class="info-card-label">

${label}

</div>


<div class="info-card-value ${color}">

${value}

</div>


</div>

`;

}




function sumCategory(items){


let total=0;


if(!items)return 0;


for(let i in items){

total+=Number(items[i])||0;

}


return total;

}





function createCard(title,items){


if(!items)return "";


let merged={};



for(let name in items){


let clean=name.trim();


merged[clean]=(merged[clean]||0)+Number(items[name]);

}



let total=0;

let content="";



for(let name in merged){


let amount=merged[name];


total+=amount;



content+=`

<div class="item">

<div class="item-name">
${name}
</div>


<div class="item-count">
x${amount.toLocaleString()}
</div>


</div>

`;

}



let id=title.replace(/\W/g,"");



return `


<div class="category-box">


<div class="category-header"
onclick="toggle('${id}')">


<div class="category-name">
${title}
</div>


<div class="category-count">
${total.toLocaleString()}x
</div>


</div>



<div class="category-content" id="${id}">

${content}

</div>



</div>


`;

}




function toggle(id){

document
.getElementById(id)
.classList.toggle("open");

}



loadData();


</script>


</body>

</html>
