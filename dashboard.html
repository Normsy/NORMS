<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NORMS Dashboard</title>


<style>

:root {

    --bg-color:#f7f7f9;
    --card-bg:#ffffff;
    --card-border:#e5e7eb;
    --text-main:#111827;
    --text-muted:#6b7280;
    --accent:#7928ca;

}


* {
    box-sizing:border-box;
}


body {

    font-family:'Segoe UI', Arial, sans-serif;

    background:var(--bg-color);

    color:var(--text-main);

    margin:0;

    padding:20px;

}



.container {

    max-width:1500px;

    margin:auto;

}



/* HEADER */


.header-card {

    background:white;

    border:1px solid var(--card-border);

    border-radius:20px;

    padding:25px;

    display:flex;

    align-items:center;

    gap:20px;

    box-shadow:0 8px 25px rgba(0,0,0,.06);

    margin-bottom:25px;

}


.header-icon {

    width:65px;

    height:65px;

    border-radius:18px;

    background:#7928ca;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;

}



.header-title h1 {

    margin:0;

}



.header-title p {

    margin:5px 0 0;

    color:var(--text-muted);

}



/* STATS */


.stats-grid {

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

    margin-bottom:25px;

}



.stat-card {

    background:white;

    border:1px solid var(--card-border);

    border-radius:16px;

    padding:20px;

}



.stat-label {

    color:var(--text-muted);

    font-size:12px;

}



.stat-value {

    font-size:22px;

    font-weight:700;

    margin-top:8px;

}



/* CATEGORY */


.category-box {

    background:white;

    border:1px solid var(--card-border);

    border-radius:18px;

    margin-bottom:15px;

    overflow:hidden;

}



.category-header {


    padding:18px;

    display:flex;

    justify-content:space-between;

    cursor:pointer;

    font-size:18px;

    font-weight:700;


}



.category-header:hover {

    background:#f3f4f6;

}



.category-content {

    display:none;

    padding:15px;

    border-top:1px solid var(--card-border);

}



.category-content.open {

    display:block;

}



/* ITEMS */


.inventory-grid {

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));

    gap:12px;

}



.item-card {

    background:#f9fafb;

    border:1px solid var(--card-border);

    border-radius:12px;

    padding:15px;

}



.item-name {

    font-weight:600;

}



.item-qty {

    color:#16a34a;

    font-weight:700;

    margin-top:5px;

}



.loading,
.error {

    background:white;

    padding:40px;

    border-radius:15px;

    text-align:center;

}



@media(max-width:900px){

    .stats-grid {

        grid-template-columns:repeat(2,1fr);

    }

}



@media(max-width:600px){

    .stats-grid {

        grid-template-columns:1fr;

    }

}


</style>


</head>



<body>


<div class="container">



<div class="header-card">


<div class="header-icon">
🌿
</div>


<div class="header-title">

<h1>Grow A Garden 2</h1>

<p>NORMS Live Account Dashboard</p>

</div>


</div>




<div id="profile">

<div class="loading">
Loading data...
</div>

</div>



</div>



<script>


const API =
"https://norms.bazarte-clarkjohn06.workers.dev";


const username =
"Gyazuv";





async function loadData(){


try{


const response =
await fetch(
API + "/account?username=" + username
);



const data =
await response.json();



if(!data.success){

document.getElementById("profile").innerHTML =
"Account not found";

return;

}



const account =
data.account;


const inv =
account.inventory || {};



let total = 0;


Object.values(inv).forEach(category=>{

if(category){

Object.values(category).forEach(amount=>{

total += Number(amount) || 0;

});

}

});





document.getElementById("profile").innerHTML = `



<div class="stats-grid">


<div class="stat-card">

<div class="stat-label">
ACCOUNT
</div>

<div class="stat-value">
🟢 Online
</div>

</div>




<div class="stat-card">

<div class="stat-label">
SHECKLES
</div>

<div class="stat-value">
💰 ${Number(account.sheckles).toLocaleString()}
</div>

</div>




<div class="stat-card">

<div class="stat-label">
ITEMS
</div>

<div class="stat-value">
📦 ${total.toLocaleString()}
</div>

</div>




<div class="stat-card">

<div class="stat-label">
ROBLOX ID
</div>

<div class="stat-value">
${account.roblox_userid}
</div>

</div>


</div>



${renderCategory("🌱 Seeds", inv.Seeds)}

${renderCategory("⚙️ Gear", inv.Gear)}

${renderCategory("📦 Crates", inv.Crates)}

${renderCategory("🐾 Pets", inv.Pets)}



`;



}

catch(e){

console.log(e);


document.getElementById("profile").innerHTML =
`
<div class="error">
Failed connecting to API
</div>
`;

}


}





function renderCategory(title,items){



if(!items || Object.keys(items).length===0){

return "";

}



let total = 0;


let html = "";



for(let item in items){


let amount =
Number(items[item]) || 0;


total += amount;



html += `


<div class="item-card">


<div class="item-name">
${item}
</div>


<div class="item-qty">
x${amount.toLocaleString()}
</div>


</div>


`;

}



let id =
title.replace(/\W/g,"");



return `


<div class="category-box">


<div class="category-header"
onclick="toggle('${id}')">


<span>
${title}
</span>


<span>
${total.toLocaleString()}x ▼
</span>


</div>




<div class="category-content"
id="${id}">


<div class="inventory-grid">

${html}

</div>


</div>


</div>


`;

}





function toggle(id){

document
.getElementById(id)
.classList.toggle("open");

}





loadData();


</script>



</body>

</html>
