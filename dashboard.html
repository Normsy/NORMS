<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMS Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Segoe UI, Arial, sans-serif;
    background: #0f0f13;
    color: #f3f4f6;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.account-header {
    background: #181820;
    border: 1px solid #2d2d3a;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

.account-tabs {
    display: flex;
    gap: 24px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #9ca3af;
    text-transform: uppercase;
    margin-bottom: 16px;
    border-bottom: 1px solid #2d2d3a;
    padding-bottom: 10px;
    overflow-x: auto;
    scrollbar-width: none; /* Firefox */
}

.account-tabs::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Opera */
}

.account-tabs span {
    cursor: pointer;
    white-space: nowrap;
}

.account-tabs span.active {
    color: #ffffff;
}

/* Scrollable container for Account, Sheckles, Seeds, Gears, Crates, Pets */
.scrollable-row {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: #2d2d3a transparent;
}

.scrollable-row::-webkit-scrollbar {
    height: 4px;
}

.scrollable-row::-webkit-scrollbar-thumb {
    background: #2d2d3a;
    border-radius: 4px;
}

/* Individual card styling inside the scrollable row to keep them neat */
.info-card {
    background: #121217;
    border: 1px solid #2d2d3a;
    border-radius: 12px;
    padding: 10px 14px;
    min-width: 130px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.info-card-label {
    font-size: 11px;
    text-transform: uppercase;
    color: #9ca3af;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
}

.info-card-value {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
}

/* Specific styling for Account card to keep user details intact */
.account-info-card {
    min-width: 200px;
    background: #121217;
    border: 1px solid #2d2d3a;
    border-radius: 12px;
    padding: 8px 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(34,197,94,0.6);
    flex-shrink: 0;
}

.username-area {
    display: flex;
    flex-direction: column;
}

.username {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
}

.platform-time {
    font-size: 11px;
    color: #9ca3af;
}

/* Badges styling */
.money-value {
    color: #f87171;
}

.stat-value {
    color: #4ade80;
}

/* Category Grid below */
.category-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

.category-box {
    background: #181820;
    border: 1px solid #2d2d3a;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

.category-header {
    padding: 16px;
    cursor: pointer;
}

.category-header:hover {
    background: #1f1f2a;
}

.category-name {
    font-size: 15px;
    font-weight: 600;
    color: #e5e7eb;
}

.category-count {
    margin-top: 6px;
    font-size: 20px;
    font-weight: 800;
    color: #4ade80;
}

.category-content {
    display: none;
    padding: 12px;
    border-top: 1px solid #2d2d3a;
    background: #121217;
}

.category-content.open {
    display: block;
}

.item {
    display: flex;
    justify-content: space-between;
    background: #181820;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    border: 1px solid #252533;
}

.item-name {
    font-weight: 500;
    font-size: 13px;
    color: #e5e7eb;
}

.item-count {
    color: #4ade80;
    font-weight: 700;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #9ca3af;
}

@media(max-width: 1100px) {
    .category-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .category-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div id="dashboard">
        <div class="loading">Loading NORMS...</div>
    </div>
</div>

<script>
const API = "https://norms.bazarte-clarkjohn06.workers.dev";
const username = "Gyazuv";

async function loadData() {
    const res = await fetch(API + "/account?username=" + username);
    const data = await res.json();

    if (!data.success) {
        document.getElementById("dashboard").innerHTML = "Account not found";
        return;
    }

    const account = data.account;
    const inv = account.inventory || {};

    // Calculate totals for quick stats display if needed, or fallback to inventory items count
    const seedTotal = sumCategory(inv.Seeds);
    const gearTotal = sumCategory(inv.Gear);
    const cratesTotal = sumCategory(inv.Crates);
    const petsTotal = sumCategory(inv.Pets);

    document.getElementById("dashboard").innerHTML = `
        <div class="account-header">
            <div class="account-tabs">
                <span class="active">Account</span>
                <span>Sheckles</span>
                <span>Seeds</span>
                <span>Gears</span>
                <span>Crates</span>
                <span>Pets</span>
            </div>
            
            <div class="scrollable-row">
                <div class="account-info-card">
                    <div class="status-dot"></div>
                    <div class="username-area">
                        <div class="username">${account.roblox_username}</div>
                        <div class="platform-time">Roblox &bull; Just now</div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Sheckles</div>
                    <div class="info-card-value money-value">41.31B</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Seeds</div>
                    <div class="info-card-value stat-value">${seedTotal.toLocaleString()}x</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Gears</div>
                    <div class="info-card-value stat-value">${gearTotal.toLocaleString()}x</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Crates</div>
                    <div class="info-card-value stat-value">${cratesTotal.toLocaleString()}x</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Pets</div>
                    <div class="info-card-value stat-value">${petsTotal.toLocaleString()}x</div>
                </div>
            </div>
        </div>

        <div class="category-container">
            ${createCard("🌱 Seeds", inv.Seeds)}
            ${createCard("⚙️ Gear", inv.Gear)}
            ${createCard("📦 Crates", inv.Crates)}
            ${createCard("🐾 Pets", inv.Pets)}
        </div>
    `;
}

function sumCategory(items) {
    if (!items) return 0;
    let total = 0;
    for (let name in items) {
        total += Number(items[name]) || 0;
    }
    return total;
}

function createCard(title, items) {
    if (!items) {
        return "";
    }

    let total = 0;
    let content = "";

    for (let name in items) {
        let amount = Number(items[name]) || 0;
        total += amount;

        content += `
            <div class="item">
                <div class="item-name">${name}</div>
                <div class="item-count">x${amount.toLocaleString()}</div>
            </div>
        `;
    }

    const id = title.replace(/\W/g, "");

    return `
        <div class="category-box">
            <div class="category-header" onclick="toggle('${id}')">
                <div class="category-name">${title}</div>
                <div class="category-count">${total.toLocaleString()}x</div>
            </div>
            <div class="category-content" id="${id}">
                ${content}
            </div>
        </div>
    `;
}

function toggle(id) {
    document.getElementById(id).classList.toggle("open");
}

loadData();
</script>

</body>
</html>
