<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NORMS Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:8px;
font-family:Segoe UI,Arial,sans-serif;
background:#f5f5f7;
color:#111827;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
overflow:hidden;
}


.container{
width:100%;
max-width:1200px;
margin:auto;
display:flex;
flex-direction:column;
justify-content:center;
max-height:100vh;
}


/* LOGIN / REGISTER */

.auth-box{

max-width:400px;
margin:auto;
background:white;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}


.auth-title{

font-size:25px;
font-weight:900;
margin-bottom:5px;

}


.auth-subtitle{

font-size:13px;
color:#6b7280;
margin-bottom:20px;

}


input{

width:100%;
padding:10px 12px;
border:1px solid #d1d5db;
border-radius:10px;
margin-bottom:10px;
font-size:15px;

}


button{

border:none;
background:#111827;
color:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;

}


.auth-btn{

width:100%;

}


.switch{

margin-top:12px;
text-align:center;
font-size:13px;
color:#6b7280;
cursor:pointer;

}


.error{

color:#ef4444;
font-size:13px;
margin-bottom:8px;

}


.success{

color:#16a34a;
font-size:13px;
margin-bottom:8px;

}

/* SIMPLE CAPTCHA */

.captcha-box{

display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;

}

.captcha-display{

background:#f3f4f6;
border:1px solid #d1d5db;
padding:8px 12px;
border-radius:10px;
font-weight:800;
letter-spacing:3px;
font-size:15px;
user-select:none;
color:#374151;
min-width:90px;
text-align:center;

}

.captcha-box input{

margin-bottom:0;

}


/* LOADING SCREEN */

.loading-screen{

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:30px;
background:white;
border:1px solid #e5e7eb;
border-radius:18px;
max-width:350px;
margin:auto;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;

}

.spinner{

width:35px;
height:35px;
border:4px solid #e5e7eb;
border-top:4px solid #111827;
border-radius:50%;
animation:spin 0.8s linear infinite;
margin-bottom:12px;

}

@keyframes spin{

0%{ transform: rotate(0deg); }
100%{ transform: rotate(360deg); }

}

.loading-text{

font-weight:700;
font-size:14px;
color:#374151;

}



/* HERO */

.hero-box{

background:white;
border:1px solid #e5e7eb;
border-radius:14px;
padding:12px 15px;
margin-bottom:8px;
box-shadow:0 3px 10px rgba(0,0,0,.04);
display:flex;
align-items:center;
gap:12px;

}


.hero-icon{

width:45px;
height:45px;
border-radius:10px;
object-fit:cover;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:700;
color:#6b7280;
text-align:center;
flex-shrink:0;

}


.hero-title{

font-size:18px;
font-weight:800;
line-height:1.2;

}


.hero-subtitle{

font-size:12px;
color:#6b7280;
margin-top:2px;

}


/* STATS */

.stats-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-bottom:8px;

}


.stat-card{

background:white;
border:1px solid #e5e7eb;
border-radius:14px;
padding:10px 12px;

}


.stat-label{

font-size:10px;
font-weight:700;
color:#6b7280;

}


.stat-value{

font-size:18px;
font-weight:800;
color:#16a34a;
margin-top:2px;

}


.stat-value.money{

color:#111827;

}


/* NAVIGATION CARDS */

.nav-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-bottom:8px;

}

.accounts-toggle-card{

background:white;
border:1px solid #e5e7eb;
border-radius:14px;
padding:10px 12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,.04);

}


.accounts-toggle-title{

font-size:14px;
font-weight:800;

}


.logout{

width:100%;
background:#ef4444;
padding:10px;
font-size:14px;

}

/* ACCOUNT CARD */

.account-box{

background:white;
border:1px solid #e5e7eb;
border-radius:14px;
padding:12px;
margin-top:8px;
box-shadow:0 3px 10px rgba(0,0,0,.04);

}


.account-header-row{

display:flex;
justify-content:space-between;
align-items:center;

}


.account-info-col{

display:flex;
flex-direction:column;

}


.user{

font-size:16px;
font-weight:800;

}


.status{

font-size:11px;
margin-top:2px;

}


.online{

color:#16a34a;

}


.offline{

color:#6b7280;

}


.open-btn{

background:#111827;
padding:6px 12px;
font-size:13px;

}


/* INVENTORY */

.account-dashboard-slot{

margin-top:10px;

}


.slider-container{

overflow-x:auto;
scrollbar-width:none;

}


.slider-container::-webkit-scrollbar{

display:none;

}


.slider{

display:flex;
gap:8px;
width:max-content;

}


.card{

min-width:120px;
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:10px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.03);

}


.label{

font-size:11px;
font-weight:700;
color:#6b7280;

}


.value{

margin-top:5px;
font-size:18px;
font-weight:800;
color:#16a34a;

}


.money{

color:#ef4444;

}


/* DROPDOWN */


.global-dropdown{

display:none;
background:white;
border:1px solid #e5e7eb;
border-radius:10px;
padding:8px;
margin-top:8px;
max-height:180px;
overflow-y:auto;

}


.global-dropdown.open{

display:block;

}


.dropdown-header{

font-size:13px;
font-weight:800;
margin-bottom:6px;

}


.item{

display:flex;
justify-content:space-between;
background:#f9fafb;
padding:7px;
border-radius:6px;
margin-bottom:4px;
font-size:13px;

}


.item-name{

font-weight:600;

}


.item-count{

font-weight:800;
color:#16a34a;

}


.empty{

color:#6b7280;
padding:8px;
font-size:13px;

}


.back{

background:#111827;
margin-bottom:8px;
padding:8px 14px;
font-size:13px;

}


/* SCRIPT DASHBOARD STYLES */

.script-box{

background:white;
border:1px solid #e5e7eb;
border-radius:14px;
padding:14px;
margin-top:8px;
box-shadow:0 3px 10px rgba(0,0,0,.04);

}

.script-section-title{

font-size:14px;
font-weight:800;
margin-bottom:6px;

}

.key-display-box{

display:flex;
gap:8px;
margin-bottom:10px;

}

.key-input{

flex:1;
background:#f3f4f6;
font-family:monospace;
font-weight:700;
color:#374151;
margin-bottom:0;
padding:8px 10px;
font-size:13px;

}

.copy-btn{

background:#111827;
padding:0 12px;
border-radius:10px;
font-size:12px;

}

.code-block-container{

position:relative;

}

.script-code-area{

width:100%;
height:100px;
background:#111827;
color:#34d399;
font-family:monospace;
font-size:12px;
padding:10px;
border-radius:10px;
resize:none;
border:none;
outline:none;
line-height:1.3;

}

.copy-script-btn{

position:absolute;
top:8px;
right:8px;
background:#374151;
color:white;
padding:4px 10px;
font-size:11px;
border-radius:6px;

}


</style>

</head>


<body>


<div class="container">


<div id="app">

Loading NORMS...

</div>


</div>


<script>


const API = "https://norms-api-v2.bazarte-clarkjohn06.workers.dev";


let secretKey = localStorage.getItem("norms_secret");
let accounts = [];
let inventoryData = {};
let currentInventory = {};
let activeDropdown = null;
let currentCaptcha = "";



function generateCaptcha(){
let chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let code = "";
for(let i=0; i<4; i++){
code += chars[Math.floor(Math.random() * chars.length)];
}
currentCaptcha = code;
}



function saveSecret(key){

secretKey = key;

localStorage.setItem(
"norms_secret",
key
);

}



function showLoading(text){
document.body.style.display = "flex";
document.getElementById("app").innerHTML = `
<div class="loading-screen">
<div class="spinner"></div>
<div class="loading-text">${text}</div>
</div>
`;
}



function logout(){

showLoading("Logging out...");

setTimeout(()=>{

localStorage.removeItem("norms_secret");
secretKey = null;
showLogin();

}, 600);

}



function showLogin(){

generateCaptcha();

document.body.style.display = "flex";

document.getElementById("app").innerHTML = `


<div class="auth-box">


<div class="auth-title">

NORMS

</div>


<div class="auth-subtitle">

Login to your dashboard

</div>


<div id="message"></div>


<input id="loginUser" placeholder="Username">


<input id="loginPass" type="password" placeholder="Password">


<div class="captcha-box">
<div class="captcha-display" id="loginCaptchaText">${currentCaptcha}</div>
<input id="loginCaptchaInput" placeholder="Enter code">
</div>


<button class="auth-btn" onclick="login()">

Login

</button>


<div class="switch" onclick="showRegister()">

Create account

</div>


</div>


`;

}



function showRegister(){

generateCaptcha();

document.body.style.display = "flex";

document.getElementById("app").innerHTML = `


<div class="auth-box">


<div class="auth-title">

NORMS

</div>


<div class="auth-subtitle">

Create your account

</div>


<div id="message"></div>


<input id="regUser" placeholder="Username">


<input id="regPass" type="password" placeholder="Password">


<div class="captcha-box">
<div class="captcha-display" id="regCaptchaText">${currentCaptcha}</div>
<input id="regCaptchaInput" placeholder="Enter code">
</div>


<button class="auth-btn" onclick="register()">

Register

</button>


<div class="switch" onclick="showLogin()">

Already have account

</div>


</div>


`;

}

async function login(){

const username =
document.getElementById("loginUser").value.trim();

const password =
document.getElementById("loginPass").value;

const captchaInput =
document.getElementById("loginCaptchaInput").value.trim().toUpperCase();


if(captchaInput !== currentCaptcha){
document.getElementById("message").innerHTML =
`<div class="error">Incorrect verification code</div>`;
generateCaptcha();
document.getElementById("loginCaptchaText").innerText = currentCaptcha;
document.getElementById("loginCaptchaInput").value = "";
return;
}


showLoading("Signing in...");


const res = await fetch(API + "/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
password

})

});


const data = await res.json();


if(!data.success){

showLogin();
document.getElementById("message").innerHTML =

`<div class="error">${data.message}</div>`;

return;

}


saveSecret(data.secret_key);


loadAccounts();


}



async function register(){

const username =
document.getElementById("regUser").value.trim();

const password =
document.getElementById("regPass").value;

const captchaInput =
document.getElementById("regCaptchaInput").value.trim().toUpperCase();


if(captchaInput !== currentCaptcha){
document.getElementById("message").innerHTML =
`<div class="error">Incorrect verification code</div>`;
generateCaptcha();
document.getElementById("regCaptchaText").innerText = currentCaptcha;
document.getElementById("regCaptchaInput").value = "";
return;
}


showLoading("Creating account...");



const res = await fetch(API + "/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
password

})

});


const data = await res.json();



if(!data.success){

showRegister();
document.getElementById("message").innerHTML =

`<div class="error">${data.message}</div>`;

return;

}



saveSecret(data.secret_key);



setTimeout(()=>{

loadAccounts();

},1000);



}



async function loadAccounts(){


if(!secretKey){

showLogin();

return;

}



const res = await fetch(

API + "/accounts?secret_key=" + encodeURIComponent(secretKey)

);



const data = await res.json();



if(!data.success){

logout();

return;

}



accounts = data.accounts;


renderMain();


}



function getStatus(time){


let minutes =

(Date.now() -
new Date(time).getTime())
/1000/60;



if(minutes <= 10){

return {

icon:"🟢",

text:"Roblox • Online",

class:"online"

};

}



return {

icon:"⚫",

text:"Roblox • Offline ("+
Math.floor(minutes)+
" min ago)",

class:"offline"

};


}




function renderMain(){

document.body.style.display = "block";


let online = 0;

let totalSheckles = 0;

let totalItems = 0;

let totalPets = 0;



accounts.forEach(acc=>{


if(getStatus(acc.updated_at).class=="online"){

online++;

}



totalSheckles += Number(
acc.sheckles || 0
);



let inv = acc.inventory || {};



totalItems +=

total(inv.Seeds)

+

total(inv.Gear)

+

total(inv.Crates)

+

total(inv.Pets);



totalPets +=

total(inv.Pets);


});





document.getElementById("app").innerHTML = `


<div class="hero-box">


<div class="hero-icon">
Icon
</div>


<div>

<div class="hero-title">

Grow A Garden 2

</div>


<div class="hero-subtitle">

Overview of your tracked accounts

</div>


</div>


</div>





<div class="stats-grid">


<div class="stat-card">

<div class="stat-label">

ONLINE / TOTAL

</div>


<div class="stat-value">

${online}/${accounts.length}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL MONEY

</div>


<div class="stat-value money">

${totalSheckles.toLocaleString()}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL ITEMS

</div>


<div class="stat-value">

${totalItems.toLocaleString()}

</div>


</div>





<div class="stat-card">

<div class="stat-label">

TOTAL PETS

</div>


<div class="stat-value">

${totalPets.toLocaleString()}

</div>


</div>


</div>




<div class="nav-grid">

<div class="accounts-toggle-card"

onclick="openAccountsTab()">


<div class="accounts-toggle-title">

Accounts Dashboard

</div>


<div>

Open →

</div>


</div>


<div class="accounts-toggle-card"

onclick="openScriptTab()">


<div class="accounts-toggle-title">

Script Dashboard

</div>


<div>

Open →

</div>


</div>

</div>




<button class="logout"

onclick="logout()">

Logout

</button>



`;



}



function openAccountsTab(){


let html = `


<button class="back"

onclick="renderMain()">

← Back

</button>


<div class="hero-box">


<div class="hero-icon">
Icon
</div>


<div>


<div class="hero-title">

Accounts

</div>


<div class="hero-subtitle">

Your tracked Roblox accounts

</div>


</div>


</div>


`;



accounts.forEach(acc=>{


let status =
getStatus(acc.updated_at);



html += `


<div class="account-box">


<div class="account-header-row">


<div class="account-info-col">


<div class="user">

${status.icon}

${acc.roblox_username}

</div>



<div class="status ${status.class}">

${status.text}

</div>



</div>



<button class="open-btn" onclick="openAccount(${JSON.stringify(acc.roblox_username)})">

Inventory

</button>


</div>



<div id="slot-${acc.roblox_username}"

class="account-dashboard-slot">

</div>


</div>


`;


});



document.getElementById("app").innerHTML = html;


}



function openScriptTab(){

let robloxScript = `getgenv().SecretKey = "${secretKey || ""}";\nloadstring(game:HttpGet("${API}/script"))();`;

let html = `

<button class="back"

onclick="renderMain()">

← Back

</button>


<div class="hero-box">

<div class="hero-icon">
Icon
</div>

<div>

<div class="hero-title">

Script Dashboard

</div>

<div class="hero-subtitle">

Your Secret Key and Roblox script loader

</div>

</div>

</div>


<div class="script-box">

<div class="script-section-title">Your Secret Key</div>

<div class="key-display-box">

<input class="key-input" id="scriptKeyInput" readonly value="${secretKey || ""}">

<button class="copy-btn" onclick="copyKey()">Copy</button>

</div>


<div class="script-section-title">Roblox Execution Script</div>

<div class="code-block-container">

<textarea class="script-code-area" readonly id="robloxScriptArea">${robloxScript}</textarea>

<button class="copy-script-btn" onclick="copyScript()">Copy Script</button>

</div>

</div>

`;

document.getElementById("app").innerHTML = html;

}



function copyKey(){
let input = document.getElementById("scriptKeyInput");
input.select();
navigator.clipboard.writeText(input.value);
alert("Secret key copied to clipboard!");
}



function copyScript(){
let area = document.getElementById("robloxScriptArea");
area.select();
navigator.clipboard.writeText(area.value);
alert("Roblox script copied to clipboard!");
}



async function openAccount(username){


const res = await fetch(

API +
"/account?secret_key=" +
encodeURIComponent(secretKey) +
"&username=" +
encodeURIComponent(username)

);



const data = await res.json();



if(!data.success){

return;

}



let account = data.account;



currentInventory =
account.inventory || {};



showAccountDashboard(account);


}




function showAccountDashboard(account){


let slot = document.getElementById(

"slot-" + account.roblox_username

);



if(!slot) return;



if(slot.innerHTML !== ""){


slot.innerHTML = "";

return;


}



slot.innerHTML = `


<div class="slider-container">


<div class="slider">



${createButton(

"💰 Sheckles",

Number(account.sheckles || 0)
.toLocaleString(),

"money",

null,

account.roblox_username

)}



${createButton(

"🌱 Seeds",

total(currentInventory.Seeds)
.toLocaleString(),

"",

"Seeds",

account.roblox_username

)}



${createButton(

"⚙️ Gear",

total(currentInventory.Gear)
.toLocaleString(),

"",

"Gear",

account.roblox_username

)}



${createButton(

"📦 Crates",

total(currentInventory.Crates)
.toLocaleString(),

"",

"Crates",

account.roblox_username

)}



${createButton(

"🐾 Pets",

total(currentInventory.Pets)
.toLocaleString(),

"",

"Pets",

account.roblox_username

)}



</div>


</div>



<div class="global-dropdown"

id="drop-${account.roblox_username}">

</div>


`;



}




function createButton(label,value,color,type,user){


return `


<div class="card"

onclick="${
type ?

`toggleItems('${type}', ${JSON.stringify(user)})`

:

""

}">


<div class="label">

${label}

</div>


<div class="value ${color}">

${value}

</div>


</div>


`;


}





function total(items){


let count = 0;


if(!items){

return 0;

}



for(let item in items){

count += Number(items[item]) || 0;

}



return count;


}





function toggleItems(type,user){


let box = document.getElementById(

"drop-" + user

);



if(activeDropdown === box &&

box.classList.contains("open")){


box.classList.remove("open");

activeDropdown = null;

return;


}



activeDropdown = box;



let items =

currentInventory[type] || {};



let merged = {};



for(let name in items){


let clean = name.trim();



merged[clean] =

(merged[clean] || 0)

+

(Number(items[name]) || 0);


}





let icons = {

Seeds:"🌱",

Gear:"⚙️",

Crates:"📦",

Pets:"🐾"

};



let html = `


<div class="dropdown-header">

${icons[type] || ""}

${type} Inventory

</div>


`;



for(let name in merged){


html += `


<div class="item">


<div class="item-name">

${name}

</div>


<div class="item-count">

x${merged[name].toLocaleString()}

</div>


</div>


`;


}



box.innerHTML =

html ||

"<div class='empty'>No items</div>";



box.classList.add("open");


}




// START

if(secretKey){
showLoading("Loading dashboard...");
loadAccounts();
}else{
showLogin();
}


</script>


</body>

</html>
